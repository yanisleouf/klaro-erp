        // ==========================================
        // --- PRODUCTION : PIPELINE (Pesée -> Matelassage -> Couture -> Emballage -> Terminé) ---
        // ==========================================
        function renderProduction(area, q) {
            const activeStages = STAGES.slice(0, 4);
            const matches = (l) => !q || normalize(l.ref).includes(q) || normalize(l.name).includes(q) || normalize(l.rollRef).includes(q) || normalize(l.familyName).includes(q) || normalize(l.operator).includes(q);
            const recent = lots.filter(l => l.stage === 'termine' && matches(l)).sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 10);

            area.innerHTML = `
                <div class="card" style="max-width:700px; margin:0 auto 20px;">
                    <h3 style="text-align:center; font-size:1.4rem;"><i class="fas fa-industry" style="color:var(--brand); margin-right:10px;"></i>Nouveau Lot de Production</h3>
                    <label>Nom du lot</label><input id="pLotName" placeholder="Ex: Lot du matin">
                    <label>Opérateur en charge</label>
                    <select id="pEmp">${team.map(t => `<option value="${t}">${t}</option>`).join('') || '<option value="">Aucun opérateur configuré</option>'}</select>
                    <div class="grid-2" style="margin-top:10px;">
                        <div><label>Rouleau à découper</label><select id="pR">${rolls.filter(r => r.res > 0).map(r => `<option value="${r.id}">${r.ref} — ${r.category || ''}${r.color ? ' (' + r.color + ')' : ''} — Reste: ${r.res}kg</option>`).join('') || '<option value="">Aucun rouleau dispo</option>'}</select></div>
                        <div><label>Catégorie (Famille de produit)</label><select id="pF" onchange="calcLotPreview()">${families.map(f => `<option value="${f.id}" data-w="${f.unitWeight}">${f.name} (${f.unitWeight}kg/u)</option>`).join('') || '<option value="">Aucune famille</option>'}</select></div>
                    </div>
                    <label style="margin-top:10px;">Poids Consommé (kg)</label>
                    <input id="pW" type="number" oninput="calcLotPreview()" placeholder="Inclure le poids des déchets/chutes" style="font-size: 1.1rem; text-align:center;">
                    <div style="background:var(--bg); border:1px dashed var(--border); border-radius:12px; padding:20px; margin:25px 0; display:flex; justify-content:space-around; align-items:center;">
                        <div style="text-align:center;"><span style="color:var(--muted); font-size:0.8rem; text-transform:uppercase; font-weight:600;">Pièces Produites</span><div id="pRes" style="font-size:2.5rem; font-weight:800; color:var(--brand);">0</div></div>
                        <div style="width:1px; height:40px; background:var(--border);"></div>
                        <div style="text-align:center;"><span style="color:var(--muted); font-size:0.8rem; text-transform:uppercase; font-weight:600;">Perte / Chute</span><div id="pScrap" style="font-size:1.5rem; font-weight:800; color:var(--warning);">0.00 kg (0%)</div></div>
                    </div>
                    <button class="btn-action" onclick="createLot()" style="font-size:1rem; padding:16px;"><i class="fas fa-check-circle"></i> Créer le lot (Étape Pesée)</button>
                </div>

                <h3 style="margin:20px 0 12px;"><i class="fas fa-diagram-project" style="color:var(--brand); margin-right:8px;"></i>Pipeline de Production</h3>
                <div class="pipe-board">
                    ${activeStages.map(st => {
                        const colLots = lots.filter(l => l.stage === st && matches(l)).sort((a, b) => (b.ts || 0) - (a.ts || 0));
                        return `<div class="pipe-col">
                            <div class="pipe-col-head"><span><i class="fas ${STAGE_ICONS[st]}"></i> ${STAGE_LABELS[st]}</span><span class="pipe-count">${colLots.length}</span></div>
                            ${colLots.length ? colLots.map(l => renderLotCard(l)).join('') : `<p style="color:var(--muted); font-size:0.8rem; text-align:center; padding:20px 0;">Vide</p>`}
                        </div>`;
                    }).join('')}
                </div>

                <div class="card" style="margin-top:20px;">
                    <h3><i class="fas fa-circle-check" style="color:var(--success); margin-right:8px;"></i>Lots Terminés Récemment</h3>
                    <div class="table-responsive" style="max-height:300px;">
                        <table><thead><tr><th>Lot</th><th>Rouleau</th><th>Catégorie</th><th style="text-align:right;">Poids</th><th style="text-align:right;">Pièces Réelles</th><th style="text-align:center;">Perte</th><th>Opérateur</th><th style="text-align:right;">Action</th></tr></thead>
                        <tbody>${recent.length ? recent.map(l => `<tr><td style="font-family:monospace; color:var(--brand);">${l.name ? `${l.name}<br><small style="color:var(--muted);">${l.ref}</small>` : l.ref}</td><td>${l.rollRef || '-'}</td><td>${l.familyName}</td><td style="text-align:right;">${l.weightConsumed}kg</td><td style="text-align:right; font-weight:700; color:var(--success);">+${l.pieces}${(l.piecesEstimated != null && l.piecesEstimated !== l.pieces) ? `<br><small style="color:var(--muted); font-weight:400;">≈${l.piecesEstimated} estimé</small>` : ''}</td><td style="text-align:center; color:${l.scrapPct > 5 ? 'var(--danger)' : 'var(--muted)'};">${l.scrapKg}kg (${l.scrapPct}%)</td><td>${l.operator}</td><td style="text-align:right;">${sessionAdmin ? `<button class="icon-btn i-del" onclick="delLot('${l.id}')" title="Supprimer"><i class="fas fa-trash"></i></button>` : ''}</td></tr>`).join('') : `<tr><td colspan="8" style="text-align:center; color:var(--muted); padding:20px;">Aucun lot terminé</td></tr>`}</tbody></table>
                    </div>
                    <p style="font-size:0.8rem; color:var(--muted); margin:12px 0 0;">L'historique complet est disponible dans <b>Comptabilité › Production</b>.</p>
                </div>`;
        }

        function renderLotCard(l) {
            const stIdx = STAGES.indexOf(l.stage);
            const progress = STAGES.slice(0, 4).map((s, i) => `<span class="${i < stIdx ? 'done' : (i === stIdx ? 'now' : '')}"></span>`).join('');
            const stageSelect = sessionAdmin ? `<select style="margin:6px 0 0; padding:6px 10px; font-size:0.78rem;" onchange="setLotStage('${l.id}', this.value)">${STAGES.map(s => `<option value="${s}" ${s === l.stage ? 'selected' : ''}>${STAGE_LABELS[s]}</option>`).join('')}</select>` : '';
            return `<div class="lot-card">
                <div style="display:flex; justify-content:space-between; align-items:center;"><b class="ref">${l.name || l.ref}</b>${sessionAdmin ? `<i class="fas fa-trash icon-btn i-del" style="cursor:pointer;" onclick="delLot('${l.id}')" title="Supprimer"></i>` : ''}</div>
                ${l.name ? `<div style="font-size:0.72rem; color:var(--muted); font-family:monospace; margin-top:-4px;">${l.ref}</div>` : ''}
                <div class="stage-progress">${progress}</div>
                <div class="lot-meta">
                    Rouleau : <b style="color:var(--text);">${l.rollRef}</b><br>
                    Catégorie : <b style="color:var(--text);">${l.familyName}</b><br>
                    Poids : <b style="color:var(--text);">${l.weightConsumed}kg</b><br>
                    Pièces (estimation) : <b style="color:var(--brand);">${l.pieces}</b><br>
                    Perte : ${l.scrapKg}kg (${l.scrapPct}%)<br>
                    Opérateur : ${l.operator}
                </div>
                ${stageSelect}
                <div class="lot-actions">${l.stage !== 'termine' ? `<button class="btn-action btn-sm" style="flex:1;" onclick="advanceLot('${l.id}')"><i class="fas fa-arrow-right"></i> Avancer</button>` : ''}</div>
            </div>`;
        }

        function calcLotPreview() {
            const wInput = document.getElementById('pW'); const w = parseFloat(wInput.value) || 0;
            const selF = document.getElementById('pF'); if (!selF || selF.value === "") return;
            const u = parseFloat(selF.options[selF.selectedIndex].getAttribute('data-w')) || 0;
            const pcs = u > 0 ? Math.floor(w / u) : 0;
            const scrap = Math.max(0, w - pcs * u);
            const scrapPct = w > 0 ? (scrap / w * 100) : 0;
            document.getElementById('pRes').innerText = pcs;
            const scrapEl = document.getElementById('pScrap'); scrapEl.innerText = `${scrap.toFixed(2)} kg (${scrapPct.toFixed(1)}%)`; scrapEl.style.color = scrapPct > 5 ? 'var(--danger)' : 'var(--warning)';
        }

        function createLot() {
            const empSel = document.getElementById('pEmp'); if (!empSel || empSel.value === "") return showToast("Sélectionnez un opérateur.", "warning");
            const selR = document.getElementById('pR'); if (!selR || selR.value === "") return showToast("Sélectionnez un rouleau.", "warning");
            const selF = document.getElementById('pF'); if (!selF || selF.value === "") return showToast("Sélectionnez une catégorie.", "warning");
            const wInput = document.getElementById('pW'); const w = parseFloat(wInput.value);
            if (!w || w <= 0) return showToast("Entrez un poids valide.", "warning");

            const operator = empSel.value;
            const roll = rollById(selR.value); if (!roll) return showToast("Rouleau introuvable.", "error");
            if (w > parseFloat(roll.res) + 0.0001) return showToast(`Poids max dispo sur ${roll.ref}: ${roll.res}kg.`, "error");
            const fam = familyById(selF.value); if (!fam) return showToast("Catégorie introuvable.", "error");
            const u = fam.unitWeight;

            const pcs = Math.floor(w / u); const scrap = Math.max(0, w - pcs * u); const scrapPct = w > 0 ? (scrap / w * 100) : 0;
            roll.res = (parseFloat(roll.res) - w).toFixed(2);
            const lotRef = 'LOT-' + Date.now().toString().slice(-6);
            const name = (document.getElementById('pLotName').value || '').trim();
            lots.unshift({
                id: uid('lot'), ref: lotRef, name,
                rollId: roll.id, rollRef: roll.ref, familyId: fam.id, familyName: fam.name,
                weightConsumed: parseFloat(w.toFixed(2)), pieces: pcs, piecesEstimated: pcs,
                scrapKg: parseFloat(scrap.toFixed(2)), scrapPct: parseFloat(scrapPct.toFixed(1)), stage: 'pesee', operator, ts: Date.now(),
                history: [{ stage: 'pesee', date: nowFR(), operator }]
            });
            logAudit(`Lot créé: ${lotRef}${name ? ' (' + name + ')' : ''} — ${pcs}x ${fam.name} (rouleau ${roll.ref})`);
            showToast(`Lot ${lotRef} créé : +${pcs} pièces en attente de production.`, "success");
            render();
        }

        function advanceLot(id) {
            const l = lotById(id); if (!l) return;
            const idx = STAGES.indexOf(l.stage);
            if (idx >= STAGES.length - 1) return;
            const nextStage = STAGES[idx + 1];
            if (nextStage === 'termine') { openFinalizeLotModal(id); return; }
            l.stage = nextStage;
            l.history.push({ stage: l.stage, date: nowFR(), operator: sessionAdmin ? 'Admin' : 'Opérateur' });
            logAudit(`Lot ${l.ref} → étape "${STAGE_LABELS[l.stage]}"`);
            showToast(`Lot ${l.ref} → ${STAGE_LABELS[l.stage]}`, "success");
            render();
        }
        function setLotStage(id, stage) {
            const l = lotById(id); if (!l || l.stage === stage) return;
            if (stage === 'termine') { openFinalizeLotModal(id); return; }
            l.stage = stage; l.history.push({ stage, date: nowFR(), operator: sessionAdmin ? 'Admin' : 'Opérateur' });
            logAudit(`Lot ${l.ref} → étape corrigée "${STAGE_LABELS[stage]}"`);
            render(); showToast(`Étape mise à jour : ${STAGE_LABELS[stage]}`, "success");
        }

        // --- Finalisation du lot : saisie des pieces REELLES (comptees a l'atelier) ---
        function openFinalizeLotModal(id) {
            const l = lotById(id); if (!l) return;
            const estimate = l.piecesEstimated != null ? l.piecesEstimated : l.pieces;
            const html = `<div style="text-align:left;">
                <p style="color:var(--muted); margin:0 0 15px;">Rouleau : <b style="color:var(--text);">${l.rollRef}</b> — Catégorie : <b style="color:var(--text);">${l.familyName}</b><br>Poids consommé : <b style="color:var(--text);">${l.weightConsumed}kg</b> — Estimation théorique : <b style="color:var(--text);">≈ ${estimate} pcs</b></p>
                <label>Pièces réelles produites (comptées à l'atelier)</label>
                <input id="lot_real_pcs" type="number" value="${l.pieces}" style="margin-bottom:5px; font-size:1.3rem; text-align:center; font-weight:800;">
                <p style="font-size:0.78rem; color:var(--muted); margin:0;">Cette quantité remplacera l'estimation et sera celle utilisée pour le stock.</p>
            </div>`;
            openModal('custom', `Terminer le lot ${l.name || l.ref}`, html, (val) => {
                if (val) {
                    const real = parseFloat(document.getElementById('lot_real_pcs').value);
                    if (isNaN(real) || real < 0) { showToast('Quantité invalide.', 'warning'); return; }
                    if (l.piecesEstimated == null) l.piecesEstimated = l.pieces;
                    l.pieces = Math.round(real);
                    const fam = familyById(l.familyId);
                    if (fam) {
                        const scrap = Math.max(0, l.weightConsumed - l.pieces * fam.unitWeight);
                        l.scrapKg = parseFloat(scrap.toFixed(2));
                        l.scrapPct = l.weightConsumed > 0 ? parseFloat((scrap / l.weightConsumed * 100).toFixed(1)) : 0;
                    }
                    l.stage = 'termine';
                    l.history.push({ stage: 'termine', date: nowFR(), operator: sessionAdmin ? 'Admin' : 'Opérateur' });
                    logAudit(`Lot ${l.ref} terminé : ${l.pieces} pièces réelles (estimation théorique : ${l.piecesEstimated})`);
                    showToast(`Lot ${l.ref} terminé : stock "${l.familyName}" mis à jour (+${l.pieces} pièces réelles).`, "success");
                    render();
                } else {
                    render(); // annulé : on remet le select d'étape à son état réel
                }
            }, 'fa-clipboard-check', 'var(--success)');
        }
        function delLot(id) {
            const l = lotById(id); if (!l) return;
            const warn = l.stage === 'termine' ? `<br><br><span style="color:var(--danger);"><i class="fas fa-triangle-exclamation"></i> Ce lot est terminé : ses pièces sont peut-être déjà vendues. La suppression réduira le stock calculé de "${l.familyName}".</span>` : `<br><br>Le poids (${l.weightConsumed}kg) sera recrédité au rouleau ${l.rollRef} si celui-ci existe encore.`;
            openModal('confirm', 'Supprimer le lot', `Supprimer le lot <b>${l.name || l.ref}</b> ?${warn}`, (v) => {
                if (!v) return;
                if (l.stage !== 'termine') { const roll = rollById(l.rollId); if (roll) roll.res = (parseFloat(roll.res) + parseFloat(l.weightConsumed)).toFixed(2); }
                lots = lots.filter(x => x.id !== id);
                logAudit(`Lot supprimé: ${l.ref}`); render(); showToast("Lot supprimé.", "success");
            }, 'fa-trash', 'var(--danger)');
        }

        // ==========================================
        // --- PRODUITS : FAMILLES + VARIANTES + 3 PRIX ---
        // ==========================================
        const PRICE_TIER_LABELS = { priceDirect: 'Vente Directe', priceWholesale: 'Grossiste', pricePartner: 'Partenaire' };
        function renderProduits(area, q) {
            const filtered = families.filter(f => !q || normalize(f.name).includes(q) || (f.variants || []).some(v => normalize(v.name).includes(q)));
            area.innerHTML = `
                <div class="grid-1-2">
                    <div class="card">
                        <h3><i class="fas fa-plus-circle" style="color:var(--brand); margin-right:8px;"></i>Nouvelle Famille</h3>
                        <p style="color:var(--muted); font-size:0.82rem; margin-top:-12px;">Une famille (ex: <i>Serpillère</i>) possède un stock commun, partagé par toutes ses variantes.</p>
                        <label>Nom de la famille</label><input id="fN" placeholder="Ex: Serpillère">
                        <label>Poids unitaire (kg / pièce)</label><input id="fW" type="number" step="0.001" placeholder="Ex: 0.05">
                        <h4 style="margin-top:15px; color:var(--brand); border-top:1px solid var(--border); padding-top:15px;">Première variante &amp; ses 3 prix</h4>
                        <label>Nom de la variante</label><input id="fVN" placeholder="Ex: Serpillère Carreaux">
                        <div class="grid-3">
                            <div><label>Direct</label><input id="fP1" type="number" placeholder="DA"></div>
                            <div><label>Grossiste</label><input id="fP2" type="number" placeholder="DA"></div>
                            <div><label>Partenaire</label><input id="fP3" type="number" placeholder="DA"></div>
                        </div>
                        <button class="btn-action" onclick="addFamily()"><i class="fas fa-save"></i> Créer la famille</button>
                    </div>
                    <div class="card">
                        <h3><i class="fas fa-layer-group" style="color:var(--brand); margin-right:8px;"></i>Catalogue <span style="color:var(--muted); font-weight:400; font-size:0.85rem;">(${filtered.length} familles)</span></h3>
                        <div style="max-height:520px; overflow-y:auto;">
                        ${filtered.length ? filtered.map(f => renderFamilyBlock(f)).join('') : '<p style="text-align:center; color:var(--muted); padding:20px;">Aucun produit trouvé</p>'}
                        </div>
                    </div>
                </div>`;
        }

        function renderFamilyBlock(f) {
            const stock = getFamilyStock(f.id);
            const open = produitsOpenFamily === f.id;
            const variantsRows = (f.variants || []).map(v => `<tr>
                <td><b>${v.name}</b></td>
                <td style="text-align:right; color:var(--neon);">${(v.priceDirect || 0).toLocaleString()} DA</td>
                <td style="text-align:right; color:var(--neon);">${(v.priceWholesale || 0).toLocaleString()} DA</td>
                <td style="text-align:right; color:var(--neon);">${(v.pricePartner || 0).toLocaleString()} DA</td>
                <td style="text-align:center;">${sessionAdmin ? `<button class="icon-btn i-edit" onclick="editVariant('${f.id}','${v.id}')"><i class="fas fa-edit"></i></button><button class="icon-btn i-del" onclick="delVariant('${f.id}','${v.id}')"><i class="fas fa-trash"></i></button>` : ''}</td>
            </tr>`).join('');
            return `<div class="card" style="margin-bottom:12px; padding:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleFamily('${f.id}')">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <i class="fas fa-chevron-${open ? 'down' : 'right'}" style="color:var(--muted); width:14px;"></i>
                        <div><b style="font-size:1.05rem;">${f.name}</b><div style="font-size:0.78rem; color:var(--muted);">${f.unitWeight}kg/u · ${(f.variants || []).length} variante(s)</div></div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="badge-status ${stock > 10 ? 's-paid' : (stock > 0 ? 's-pending' : 's-danger')}">${stock} pcs</span>
                        ${sessionAdmin ? `<button class="icon-btn i-edit" onclick="event.stopPropagation(); editFamily('${f.id}')" title="Modifier"><i class="fas fa-edit"></i></button><button class="icon-btn i-del" onclick="event.stopPropagation(); delFamily('${f.id}')" title="Supprimer"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                </div>
                ${open ? `<div style="margin-top:14px; border-top:1px solid var(--border); padding-top:14px;">
                    <div class="table-responsive"><table><thead><tr><th>Variante</th><th style="text-align:right;">Direct</th><th style="text-align:right;">Grossiste</th><th style="text-align:right;">Partenaire</th><th style="text-align:center;">Action</th></tr></thead><tbody>${variantsRows}</tbody></table></div>
                    ${sessionAdmin ? `<button class="btn-action btn-ghost btn-sm" style="margin-top:10px;" onclick="addVariant('${f.id}')"><i class="fas fa-plus"></i> Ajouter une variante</button>` : ''}
                </div>` : ''}
            </div>`;
        }
        function toggleFamily(id) { produitsOpenFamily = produitsOpenFamily === id ? null : id; render(); }

        function addFamily() {
            const n = document.getElementById('fN').value.trim(), w = parseFloat(document.getElementById('fW').value);
            const vn = document.getElementById('fVN').value.trim() || n;
            const p1 = parseFloat(document.getElementById('fP1').value) || 0, p2 = parseFloat(document.getElementById('fP2').value) || 0, p3 = parseFloat(document.getElementById('fP3').value) || 0;
            if (!n || !w) return showToast("Nom et poids unitaire requis.", "warning");
            families.push({ id: uid('fam'), name: n, unitWeight: w, variants: [{ id: uid('var'), name: vn, priceDirect: p1, priceWholesale: p2, pricePartner: p3 }] });
            logAudit(`Famille créée: ${n}`); render(); showToast("Famille créée.", "success");
        }
        function editFamily(id) {
            const f = familyById(id); if (!f) return;
            const html = `<div style="text-align:left;"><label>Nom</label><input id="e_fN" value="${f.name}" style="margin-bottom:10px;"><label>Poids unitaire (kg)</label><input id="e_fW" type="number" step="0.001" value="${f.unitWeight}" style="margin-bottom:10px;"></div>`;
            openModal('custom', 'Modifier la Famille', html, (val) => {
                if (val) { f.name = document.getElementById('e_fN').value || f.name; f.unitWeight = parseFloat(document.getElementById('e_fW').value) || f.unitWeight; logAudit(`Famille modifiée: ${f.name}`); render(); showToast("Famille mise à jour.", "success"); }
            }, 'fa-layer-group', 'var(--brand)');
        }
        function delFamily(id) {
            const f = familyById(id); if (!f) return;
            const used = lots.some(l => l.familyId === id);
            openModal('confirm', 'Attention', `Supprimer la famille <b>${f.name}</b> et ses ${(f.variants || []).length} variante(s) ?${used ? '<br><br><span style="color:var(--warning);">Des lots de production y font déjà référence — leur historique sera conservé mais la famille ne sera plus sélectionnable.</span>' : ''}`, (v) => {
                if (v) { families = families.filter(x => x.id !== id); if (produitsOpenFamily === id) produitsOpenFamily = null; logAudit(`Famille supprimée: ${f.name}`); render(); showToast("Famille supprimée.", "success"); }
            }, 'fa-trash', 'var(--danger)');
        }
        function addVariant(famId) {
            const html = `<div style="text-align:left;"><label>Nom de la variante</label><input id="v_N" placeholder="Ex: Uni" style="margin-bottom:10px;"><div class="grid-3"><div><label>Direct</label><input id="v_P1" type="number" style="margin-bottom:0;"></div><div><label>Grossiste</label><input id="v_P2" type="number" style="margin-bottom:0;"></div><div><label>Partenaire</label><input id="v_P3" type="number" style="margin-bottom:0;"></div></div></div>`;
            openModal('custom', 'Ajouter une Variante', html, (val) => {
                if (val) {
                    const f = familyById(famId); const n = document.getElementById('v_N').value.trim(); if (!n) return showToast("Nom requis.", "warning");
                    f.variants.push({ id: uid('var'), name: n, priceDirect: parseFloat(document.getElementById('v_P1').value) || 0, priceWholesale: parseFloat(document.getElementById('v_P2').value) || 0, pricePartner: parseFloat(document.getElementById('v_P3').value) || 0 });
                    logAudit(`Variante ajoutée: ${n} (${f.name})`); render(); showToast("Variante ajoutée.", "success");
                }
            }, 'fa-tag', 'var(--brand)');
        }
        function editVariant(famId, varId) {
            const f = familyById(famId); const v = variantById(f, varId); if (!v) return;
            const html = `<div style="text-align:left;"><label>Nom de la variante</label><input id="v_N" value="${v.name}" style="margin-bottom:10px;"><div class="grid-3"><div><label>Direct</label><input id="v_P1" type="number" value="${v.priceDirect || 0}" style="margin-bottom:0;"></div><div><label>Grossiste</label><input id="v_P2" type="number" value="${v.priceWholesale || 0}" style="margin-bottom:0;"></div><div><label>Partenaire</label><input id="v_P3" type="number" value="${v.pricePartner || 0}" style="margin-bottom:0;"></div></div></div>`;
            openModal('custom', 'Modifier la Variante', html, (val) => {
                if (val) {
                    v.name = document.getElementById('v_N').value.trim() || v.name;

        function updateVenteVariants() {
            const selF = document.getElementById('lF'); const selVar = document.getElementById('lVar'); if (!selF || !selVar) return;
            const fam = familyById(selF.value);
            selVar.innerHTML = fam ? (fam.variants || []).map(v => `<option value="${v.id}">${v.name}</option>`).join('') : '<option value="">-</option>';
            updateVentePricePreview();
        }
        function updateVentePricePreview() {
            const selF = document.getElementById('lF'), selVar = document.getElementById('lVar'), selTier = document.getElementById('lTier'), info = document.getElementById('ventePriceInfo');
            if (!selF || !selVar || !info) return;
            const fam = familyById(selF.value); const v = variantById(fam, selVar.value);
            if (!v) { info.innerText = ''; return; }
            const price = v[selTier.value] || 0; const stock = getFamilyStock(fam.id);
            info.innerHTML = `Prix unitaire : <b style="color:var(--neon);">${price.toLocaleString()} DA</b> &nbsp;|&nbsp; Stock famille disponible : <b>${stock}</b> pcs`;
        }

        function cartQtyInFamily(familyId) { return currentCart.filter(i => i.familyId === familyId).reduce((a, b) => a + b.qty, 0); }

        function addToCart() {
            const selF = document.getElementById('lF'), selVar = document.getElementById('lVar'), selTier = document.getElementById('lTier');
            if (!selF || selF.value === "") return showToast("Aucune famille disponible.", "error");
            const fam = familyById(selF.value); const v = variantById(fam, selVar.value);
            if (!v) return showToast("Sélectionnez une variante.", "error");
            const q = parseInt(document.getElementById('lQtyPcs').value) || 0;
            if (q <= 0) return showToast("Quantité invalide.", "error");
            const unitPrice = v[selTier.value] || 0;
            const available = getFamilyStock(fam.id) - cartQtyInFamily(fam.id);
            if (q > available) return showToast(`Stock insuffisant (${available} dispo pour ${fam.name})`, "error");
            currentCart.push({ familyId: fam.id, familyName: fam.name, variantId: v.id, variantName: v.name, priceTier: selTier.value, tierLabel: PRICE_TIER_LABELS[selTier.value], qty: q, unitPrice, total: q * unitPrice });
            document.getElementById('lQtyPcs').value = '';
            renderCartList(); updateVentePricePreview();
        }
        function addCustomToCart() {
            const name = document.getElementById('lc_name').value.trim();
            const q = parseInt(document.getElementById('lc_qt').value) || 0;
            const price = parseFloat(document.getElementById('lc_price').value) || 0;
            if (!name || q <= 0 || price < 0) return showToast("Veuillez remplir les champs correctement", "error");
            currentCart.push({ custom: true, name, qty: q, unitPrice: price, total: q * price });
            document.getElementById('lc_name').value = ''; document.getElementById('lc_qt').value = ''; document.getElementById('lc_price').value = '';
            renderCartList(); showToast("Article libre ajouté", "success");
        }
        function removeCart(idx) { currentCart.splice(idx, 1); renderCartList(); updateVentePricePreview(); }

        function renderCartList() {
            const list = document.getElementById('cartDOMList'); const totalE = document.getElementById('cartDOMTotal');
            if (!list || !totalE) return;
            if (currentCart.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding: 30px; color:var(--muted);"><i class="fas fa-box-open" style="font-size:2rem; opacity:0.3; display:block; margin-bottom:10px;"></i>Panier vide</div>`;
                totalE.innerText = '0 DA'; return;
            }
            let html = '', total = 0;
            currentCart.forEach((it, idx) => {
                total += it.total;
                const title = it.custom ? it.name : `${it.familyName} — ${it.variantName}`;
                const sub = it.custom ? `<span class="badge-status s-muted">Hors catalogue</span>` : `<span class="badge-status s-purple">${it.tierLabel}</span>`;
                html += `<div style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0; border-bottom:1px solid rgba(255,255,255,0.05);">
                    <div style="display:flex; flex-direction:column; gap:4px;">
                        <span style="font-weight:600; color:var(--text);">${title}</span>
                        <div style="display:flex; align-items:center; gap:8px;">${sub}<span style="color:var(--muted); font-size:0.8rem;">${it.qty} × ${it.unitPrice.toLocaleString()} DA</span></div>
                    </div>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <span style="font-weight:800; color:var(--neon);">${it.total.toLocaleString()} DA</span>
                        <button onclick="removeCart(${idx})" style="background:transparent; border:none; color:var(--danger); cursor:pointer;"><i class="fas fa-times"></i></button>
                    </div>
                </div>`;
            });
            list.innerHTML = html; totalE.innerText = total.toLocaleString() + ' DA';
        }

        function doL(isProforma) {
            if (currentCart.length === 0) return showToast("Le panier est vide.", "warning");
            const empSel = document.getElementById('lEmp'), cSel = document.getElementById('lC'), statusSel = document.getElementById('lStatus');
            if (!empSel || !empSel.value) return showToast("Sélectionnez le responsable.", "warning");
            if (!cSel || !cSel.value) return showToast("Sélectionnez un client.", "warning");
            const operator = empSel.value, cName = cSel.value, payStatus = statusSel.value;
            const dueDate = document.getElementById('lDueDate') ? document.getElementById('lDueDate').value : null;
            if (payStatus === 'pending' && !isProforma && !dueDate) return showToast("Veuillez définir une date limite pour ce crédit.", "warning");

            // Verification finale du stock (securite en cas de double-saisie)
            for (const it of currentCart) {
                if (!it.custom) {
                    const soldElsewhereInCart = currentCart.filter(x => x.familyId === it.familyId).reduce((a, b) => a + b.qty, 0);
                    if (getFamilyStock(it.familyId) < soldElsewhereInCart) return showToast(`Stock insuffisant pour ${it.familyName}.`, "error");
                }
            }

            const totalAmount = currentCart.reduce((a, b) => a + b.total, 0);
            const docNum = isProforma ? `PROF-${Date.now().toString().slice(-6)}` : nextInvoiceNumber();
            const entry = { id: uid('sl'), date: nowFR(), ts: Date.now(), client: cName, items: [...currentCart], total: totalAmount, emp: operator, status: payStatus, dueDate: dueDate, delivery: 'pending', bl: docNum };

            printSalesDocument(isProforma, entry);

            if (!isProforma) {
                shipLogs.unshift(entry);
                logAudit(`Vente ${docNum} pour ${cName} (${totalAmount} DA)`);
                currentCart = []; renderCartList(); showToast("Vente validée et enregistrée en compta !", "success");
            }
            setTimeout(() => {
                openModal('confirm', 'Impression Document', `Voulez-vous imprimer le ${isProforma ? 'Devis' : 'Bon de Livraison'} ?`, (v) => {
                    if (v) window.print();
                    if (!isProforma) goToCompta('ventes');
                }, 'fa-print', 'var(--brand)');
            }, 400);
        }

        // ==========================================
        // --- COMPTABILITÉ (refonte : filtres, edition, export, graphique) ---
        // ==========================================
        function comptaFilteredVentes(q) {
            return shipLogs.filter(f => {
                if ((comptaFilters.from || comptaFilters.to) && !checkInRange(f.ts, comptaFilters.from, comptaFilters.to)) return false;
                if (comptaFilters.client !== 'tous' && f.client !== comptaFilters.client) return false;
                if (comptaFilters.emp !== 'tous' && f.emp !== comptaFilters.emp) return false;
                if (comptaFilters.status !== 'tous' && f.status !== comptaFilters.status) return false;
                if (comptaModel !== 'tous' && !(f.items || []).some(i => i.familyId === comptaModel)) return false;
                if (q && !normalize(f.client + ' ' + f.bl + ' ' + f.emp + ' ' + (f.items || []).map(i => i.familyName || i.name).join(' ')).includes(q)) return false;
                return true;
            });
        }
        function comptaFilteredExpenses(q) {
            return expenses.filter(f => {
                if ((comptaFilters.from || comptaFilters.to) && !checkInRange(f.ts, comptaFilters.from, comptaFilters.to)) return false;
                if (q && !normalize(f.desc).includes(q)) return false;
                return true;
            });
        }
        function comptaFilteredLots(q) {
            return lots.filter(l => l.stage === 'termine').filter(l => {
                if ((comptaFilters.from || comptaFilters.to) && !checkInRange(l.ts, comptaFilters.from, comptaFilters.to)) return false;
                if (comptaFilters.emp !== 'tous' && l.operator !== comptaFilters.emp) return false;
                if (comptaModel !== 'tous' && l.familyId !== comptaModel) return false;
                if (q && !(normalize(l.ref).includes(q) || normalize(l.name).includes(q) || normalize(l.familyName).includes(q) || normalize(l.operator).includes(q))) return false;
                return true;
            });
        }

        function renderVenteRow(f) {

        function renderComptaChart() {
            const ctx = document.getElementById('comptaChartCanvas'); if (!ctx || typeof Chart === 'undefined') return;
            if (comptaChart) comptaChart.destroy();

            let labels = [], data = [], label = '', color = 'rgba(59,130,246,0.8)', type = 'bar';
            if (comptaView === 'ventes') {
                const byClient = {}; comptaFilteredVentes('').forEach(f => { byClient[f.client] = (byClient[f.client] || 0) + f.total; });
                const top = Object.entries(byClient).sort((a, b) => b[1] - a[1]).slice(0, 6);
                labels = top.length ? top.map(x => x[0]) : ['Aucune donnée']; data = top.length ? top.map(x => x[1]) : [0]; label = 'CA par client (DA)';
            } else if (comptaView === 'depenses') {
                const byDay = {}; comptaFilteredExpenses('').forEach(f => { const d = f.date.split(' ')[0]; byDay[d] = (byDay[d] || 0) + f.amountDA; });
                const entries = Object.entries(byDay).slice(-8);
                labels = entries.length ? entries.map(x => x[0]) : ['Aucune donnée']; data = entries.length ? entries.map(x => x[1]) : [0]; label = 'Dépenses (DA)'; color = 'rgba(239,68,68,0.8)';
            } else {
                const byFam = {}; comptaFilteredLots('').forEach(l => { byFam[l.familyName] = (byFam[l.familyName] || 0) + (parseInt(l.pieces) || 0); });

            }
            comptaChart = new Chart(ctx, { type, data: { labels, datasets: [{ label, data, backgroundColor: color, borderRadius: 6 }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: fontColor } }, y: { grid: { display: false }, ticks: { color: fontColor } } } } });

        // ==========================================
        // --- SYSTEME DE PAIE PROFESSIONNEL ---
        // ==========================================
        function paieMigrate() {
            if (!Array.isArray(employees)) employees = [];
            if (!Array.isArray(salaryEntries)) salaryEntries = [];
            employees.forEach(e => {
                if (!e.id) e.id = uid('emp');
                if (!e.type) e.type = 'daily';
                if (typeof e.dailyRate !== 'number') e.dailyRate = parseFloat(e.dailyRate) || 1500;
                if (typeof e.active === 'undefined') e.active = true;
                if (e.type === 'piece' && (typeof e.pieceTarget !== 'number' || e.pieceTarget <= 0)) e.pieceTarget = 72;
            });
        }
        function empById(id) { return employees.find(e => e.id === id); }
        function getEntry(iso, empId) { return salaryEntries.find(s => s.date === iso && s.empId === empId && !s.piece); }
        function newId(pfx) { return uid(pfx); }

        function changePaieMonth(delta) {
            let [y, m] = paieMonth.split('-').map(Number);
            let idx = (m - 1) + delta; y = y + Math.floor(idx / 12); m = ((idx % 12) + 12) % 12;
            paieMonth = `${y}-${String(m + 1).padStart(2, '0')}`; render();
        }
        function setPaieView(v) { paieEmpDetail = null; paieView = v; render(); }

                <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;"><i id="paie-modal-icon" class="fas fa-user-tie" style="font-size:1.8rem; color:var(--brand);"></i><h3 id="paie-modal-title" style="margin:0; font-size:1.2rem; color:var(--text);">Titre</h3></div>
                <div id="paie-modal-body"></div>
                <div class="modal-actions" id="paie-modal-actions" style="margin-top:22px;"><button class="btn-action modal-btn-cancel" id="paie-modal-cancel" style="flex:1;">Annuler</button><button class="btn-action" id="paie-modal-save" style="flex:1;">Enregistrer</button></div>

            const html = `

        function setDay(iso, empId, status, amount) {
            let en = getEntry(iso, empId); const e = empById(empId);
            let amt = (typeof amount === 'number') ? amount : (en ? en.amount : (e ? e.dailyRate : 0)); if (status === 'absent') amt = 0;
            if (status === 'clear') { if (en) salaryEntries = salaryEntries.filter(s => s !== en); }
            else if (en) { en.status = status; en.amount = amt; }
            else salaryEntries.push({ id: uid('sal'), date: iso, empId, amount: amt, status });
            save();
        }
        function pointer(iso, empId, status) {
            const inp = document.getElementById('pt_amt_' + empId); const amt = inp ? (parseFloat(inp.value) || 0) : undefined;
            setDay(iso, empId, status, status === 'absent' ? 0 : amt);
            logAudit(`Pointage ${status} : ${empById(empId)?.name} (${isoToFr(iso)})`); render();
        }
        function openCellEditor(iso, empId) {
            const e = empById(empId); if (!e) return; const en = getEntry(iso, empId); const amt = en ? en.amount : e.dailyRate;
            const html = `<p style="color:var(--muted); margin:0 0 15px;"><b style="color:var(--text);">${e.name}</b> — ${isoToFr(iso)}</p>
              <label>Montant du jour (DA)</label><input id="ce_amt" type="number" value="${amt}" style="margin-bottom:18px;">
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button class="btn-action" style="background:var(--warning);" onclick="cellSet('${iso}','${empId}','present')"><i class="fas fa-user-clock"></i> Présent (dû)</button>
                <button class="btn-action" style="background:var(--success);" onclick="cellSet('${iso}','${empId}','paid')"><i class="fas fa-check"></i> Payé</button>
                <button class="btn-action" style="background:var(--danger);" onclick="cellSet('${iso}','${empId}','absent')"><i class="fas fa-xmark"></i> Absent</button>
                <button class="btn-action btn-ghost" onclick="cellSet('${iso}','${empId}','clear')"><i class="fas fa-eraser"></i> Effacer</button>
              </div>`;
            openPaieModal('Pointage', html, 'fa-calendar-day', 'var(--brand)', null);
        }
        function cellSet(iso, empId, status) { const inp = document.getElementById('ce_amt'); const amt = inp ? (parseFloat(inp.value) || 0) : undefined; setDay(iso, empId, status, status === 'absent' ? 0 : amt); closePaieModal(); render(); }

        function payrollTotals(ym) {
            const per = {}; let gPaid = 0, gUnpaid = 0;
            employees.forEach(e => { per[e.id] = { paid: 0, unpaid: 0, absent: 0, present: 0 }; });
            salaryEntries.filter(s => s.date && s.date.slice(0, 7) === ym).forEach(s => {
                if (!per[s.empId]) return;
                if (s.piece) { if (s.kind === 'pay') per[s.empId].paid += (s.amount || 0); return; }
                if (s.status === 'paid') per[s.empId].paid += (s.amount || 0);
                else if (s.status === 'present') { per[s.empId].unpaid += (s.amount || 0); per[s.empId].present++; }
                else if (s.status === 'absent') per[s.empId].absent++;
            });
            employees.forEach(e => { gPaid += per[e.id].paid; gUnpaid += per[e.id].unpaid; });
            return { per, gPaid, gUnpaid, gTotal: gPaid + gUnpaid };
        }
        function payAllMonth(empId) {
            const e = empById(empId); if (!e) return;
            const due = salaryEntries.filter(s => s.empId === empId && !s.piece && s.status === 'present' && s.date.slice(0, 7) === paieMonth);
            if (due.length === 0) return showToast('Rien à payer ce mois-ci', 'warning');
            const tot = due.reduce((a, b) => a + b.amount, 0);
            openModal('confirm', 'Payer le solde', `Marquer comme <b>payé</b> tout le dû de <b>${e.name}</b> pour ${monthLabel(paieMonth)} ?<br><br>Total : <b>${fmtDA(tot)} DA</b> sur ${due.length} jour(s).`, (v) => {
                if (v) { due.forEach(s => s.status = 'paid'); save(); logAudit(`Solde payé : ${e.name} (${fmtDA(tot)} DA)`); render(); showToast('Solde marqué comme payé', 'success'); }
            }, 'fa-money-bill-wave', 'var(--success)');
        }
        function bookPayrollExpense() {
            const { gPaid } = payrollTotals(paieMonth); if (gPaid <= 0) return showToast('Aucune paie payée ce mois-ci', 'warning');
            openModal('confirm', 'Comptabiliser en dépense', `Enregistrer <b>${fmtDA(gPaid)} DA</b> (paie payée de ${monthLabel(paieMonth)}) dans le journal des dépenses ?`, (v) => {
                if (v) { expenses.unshift({ id: uid('ex'), date: nowFR(), ts: Date.now(), desc: `Salaires payés - ${monthLabel(paieMonth)}`, amount: gPaid, currency: 'DA', amountDA: gPaid }); logAudit(`Paie comptabilisée en dépense: ${fmtDA(gPaid)} DA`); render(); showToast('Paie ajoutée aux dépenses', 'success'); }
            }, 'fa-file-invoice-dollar', 'var(--brand)');
        }

        function pieceStats(empId) {
            const e = empById(empId); const t = e.pieceTarget || 1;
            const produced = salaryEntries.filter(s => s.empId === empId && s.piece && s.kind === 'prod').reduce((a, b) => a + (b.pieces || 0), 0);
            const jPaid = salaryEntries.filter(s => s.empId === empId && s.piece && s.kind === 'pay').reduce((a, b) => a + (b.journees || 0), 0);
            const pending = produced - jPaid * t; const jAvail = Math.floor(pending / t); const remainder = pending - jAvail * t;
            return { produced, jPaid, pending, jAvail, remainder, target: t, rate: e.dailyRate };
        }
        function addPiece(empId) {
            const dInp = document.getElementById('pc_date'), pInp = document.getElementById('pc_qty'); const iso = dInp && dInp.value ? dInp.value : isoNow(); const qv = parseFloat(pInp.value) || 0;
            if (qv <= 0) return showToast('Quantité invalide', 'warning');
            salaryEntries.push({ id: uid('sal'), date: iso, empId, piece: true, kind: 'prod', pieces: qv });
            logAudit(`Production pièces: ${empById(empId).name} +${qv}`); render(); showToast('Production ajoutée', 'success');
        }
        function delPiece(id) { salaryEntries = salaryEntries.filter(s => s.id !== id); save(); render(); showToast('Entrée supprimée', 'success'); }
        function payPiece(empId) {
            const e = empById(empId); const st = pieceStats(empId); if (st.jAvail <= 0) return showToast('Objectif non atteint', 'warning');
            const amount = st.jAvail * e.dailyRate;
            openModal('confirm', 'Payer à la pièce', `Payer <b>${st.jAvail} journée(s)</b> = <b>${fmtDA(amount)} DA</b> à ${e.name} ?<br><br>Reste après paiement : ${st.remainder} pièce(s).`, (v) => {
                if (v) { salaryEntries.push({ id: uid('sal'), date: isoNow(), empId, piece: true, kind: 'pay', journees: st.jAvail, amount, status: 'paid' }); logAudit(`Paie à la pièce: ${e.name} ${st.jAvail}j (${fmtDA(amount)} DA)`); render(); showToast('Paiement enregistré', 'success'); }
            }, 'fa-hand-holding-dollar', 'var(--success)');
        }

        function renderPaie(area, q) {
            if (paieEmpDetail) { area.innerHTML = renderPaieEmployeDetail(paieEmpDetail); return; }
            const tabs = [{ k: 'pointage', label: 'Pointage', icon: 'fa-clipboard-check' }, { k: 'tableau', label: 'Tableau', icon: 'fa-table-cells' }, { k: 'piece', label: 'À la pièce', icon: 'fa-scissors' }, { k: 'employes', label: 'Employés', icon: 'fa-users' }];
            const switcher = `<div class="chip-tabs" style="margin-bottom:20px;">${tabs.map(t => `<button class="chip-tab ${paieView === t.k ? 'active' : ''}" onclick="setPaieView('${t.k}')"><i class="fas ${t.icon}"></i> ${t.label}</button>`).join('')}</div>`;
            let body = '';
            if (paieView === 'pointage') body = renderPaiePointage(q);
            else if (paieView === 'tableau') body = renderPaieTableau();
            else if (paieView === 'piece') body = renderPaiePiece();
            else if (paieView === 'employes') body = renderPaieEmployes(q);
            area.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px;">
                    <h3 style="margin:0; font-size:1.3rem; color:var(--text);"><i class="fas fa-money-bill-wave" style="color:var(--brand); margin-right:8px;"></i> Gestion de la Paie</h3>
                    <button class="btn-action" style="width:auto;" onclick="openEmpModal()"><i class="fas fa-user-plus"></i> Ajouter un employé</button>
                </div>${switcher}${body}`;
        }

        function renderPaiePointage(q) {
            const daily = employees.filter(e => e.type === 'daily' && e.active && (!q || normalize(e.name).includes(q)));
            if (daily.length === 0) return `<div class="card" style="text-align:center; color:var(--muted);">Aucun employé au jour. Ajoutez-en un via "Ajouter un employé".</div>`;
            const rows = daily.map(e => {
                const en = getEntry(paieDate, e.id); const st = en ? en.status : 'none'; const amt = en ? en.amount : e.dailyRate;
                const btn = (s, label, icon, col) => `<button class="btn-action" style="width:auto; padding:10px 14px; ${st === s ? `background:${col};` : 'background:var(--panel); border:1px solid var(--border); color:var(--muted);'}" onclick="pointer('${paieDate}','${e.id}','${s}')"><i class="fas ${icon}"></i> ${label}</button>`;
                return `<div class="emp-card" style="margin-bottom:12px; flex-wrap:wrap;">
                    <div class="emp-avatar">${e.name.charAt(0).toUpperCase()}</div>
                    <div style="flex:1; min-width:120px;"><b style="font-size:1.05rem;">${e.name}</b><div style="font-size:0.8rem; color:var(--muted);">Tarif : ${fmtDA(e.dailyRate)} DA/j</div></div>
                    <div style="width:120px;"><input type="number" id="pt_amt_${e.id}" value="${amt}" ${st === 'absent' ? 'disabled' : ''} style="margin:0;"></div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">${btn('present', 'Présent', 'fa-user-clock', 'var(--warning)')}${btn('paid', 'Payé', 'fa-check', 'var(--success)')}${btn('absent', 'Absent', 'fa-xmark', 'var(--danger)')}</div>
                </div>`;
            }).join('');
            return `<div class="card" style="display:flex; align-items:center; gap:15px; flex-wrap:wrap;">
                    <div style="flex:1; min-width:180px;"><label style="margin-bottom:4px;">Date du pointage</label><input type="date" value="${paieDate}" onchange="paieDate=this.value; render();" style="margin:0;"></div>
                    <div style="color:var(--muted); font-size:0.9rem;"><i class="fas fa-circle" style="color:var(--warning);"></i> Présent (dû) &nbsp; <i class="fas fa-circle" style="color:var(--success);"></i> Payé &nbsp; <i class="fas fa-circle" style="color:var(--danger);"></i> Absent</div>
                </div>${rows}`;
        }

        function renderPaieTableau() {
            const daily = employees.filter(e => e.type === 'daily'); const nd = daysInMonth(paieMonth); const { per, gPaid, gUnpaid, gTotal } = payrollTotals(paieMonth);
            const header = `<tr><th style="position:sticky; left:0; background:var(--panel); z-index:2;">Date</th>${daily.map(e => `<th style="text-align:center;">${e.name}</th>`).join('')}</tr>`;
            let rowsHtml = '';
            for (let d = 1; d <= nd; d++) {
                const iso = `${paieMonth}-${String(d).padStart(2, '0')}`; const [wy, wm, wd] = iso.split('-').map(Number); const dow = new Date(wy, wm - 1, wd).getDay();
                const wk = (dow === 5) ? 'color:var(--danger); font-weight:800;' : '';
                const band = weekBandOfDay(iso);
                const cells = daily.map(e => {
                    const en = getEntry(iso, e.id); let disp = '&ndash;', style = 'color:rgba(148,163,184,0.4);';
                    if (en) { if (en.status === 'paid') { disp = fmtDA(en.amount); style = 'background:var(--success); color:#fff; font-weight:700; border-radius:6px;'; } else if (en.status === 'present') { disp = fmtDA(en.amount); style = 'color:var(--warning); font-weight:700;'; } else if (en.status === 'absent') { disp = 'x'; style = 'color:var(--muted);'; } }
                    return `<td style="text-align:center; cursor:pointer; padding:8px; ${style}" onclick="openCellEditor('${iso}','${e.id}')">${disp}</td>`;
                }).join('');
                rowsHtml += `<tr class="week-band-${band}"><td style="position:sticky; left:0; background:var(--panel); font-weight:600; white-space:nowrap; ${wk}">${String(d).padStart(2, '0')}/${paieMonth.slice(5, 7)}</td>${cells}</tr>`;
            }
            const totPaid = `<tr style="border-top:2px solid var(--border);"><td style="position:sticky; left:0; background:var(--panel); font-weight:800; color:var(--success);">Total Payé</td>${daily.map(e => `<td style="text-align:center; color:var(--success); font-weight:700;">${fmtDA(per[e.id].paid)}</td>`).join('')}</tr>`;
            const totDue = `<tr><td style="position:sticky; left:0; background:var(--panel); font-weight:800; color:var(--warning);">Total Non Payé</td>${daily.map(e => `<td style="text-align:center; color:var(--warning); font-weight:700;">${fmtDA(per[e.id].unpaid)}</td>`).join('')}</tr>`;
            const totAll = `<tr><td style="position:sticky; left:0; background:var(--panel); font-weight:800;">Total</td>${daily.map(e => `<td style="text-align:center; font-weight:800;">${fmtDA(per[e.id].paid + per[e.id].unpaid)}</td>`).join('')}</tr>`;
            const payRow = `<tr><td style="position:sticky; left:0; background:var(--panel);"></td>${daily.map(e => `<td style="text-align:center;">${per[e.id].unpaid > 0 ? `<button class="btn-action btn-sm" style="background:var(--success);" onclick="payAllMonth('${e.id}')">Payer</button>` : ''}</td>`).join('')}</tr>`;
            if (daily.length === 0) return `<div class="card" style="text-align:center; color:var(--muted);">Aucun employé au jour à afficher.</div>`;
            return `<div class="card" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:15px;">
                    <div style="display:flex; align-items:center; gap:12px;"><button class="btn-action btn-sm" onclick="changePaieMonth(-1)"><i class="fas fa-chevron-left"></i></button><b style="font-size:1.1rem; text-transform:capitalize; min-width:150px; text-align:center;">${monthLabel(paieMonth)}</b><button class="btn-action btn-sm" onclick="changePaieMonth(1)"><i class="fas fa-chevron-right"></i></button></div>
                    <button class="btn-action" style="width:auto;" onclick="bookPayrollExpense()"><i class="fas fa-file-invoice-dollar"></i> Comptabiliser la paie en dépense</button>
                </div>
                <div class="dash-grid" style="grid-template-columns:repeat(auto-fit, minmax(160px,1fr));">
                    <div class="kpi-card" style="cursor:default;"><div class="kpi-icon" style="color:var(--success); background:rgba(16,185,129,0.1);"><i class="fas fa-check-double"></i></div><div class="kpi-content"><h4>Total Payé</h4><div class="val">${fmtDA(gPaid)} DA</div></div></div>
                    <div class="kpi-card" style="cursor:default;"><div class="kpi-icon" style="color:var(--warning); background:rgba(245,158,11,0.1);"><i class="fas fa-hand-holding-dollar"></i></div><div class="kpi-content"><h4>Reste à payer</h4><div class="val">${fmtDA(gUnpaid)} DA</div></div></div>
                    <div class="kpi-card" style="cursor:default;"><div class="kpi-icon"><i class="fas fa-coins"></i></div><div class="kpi-content"><h4>Total du mois</h4><div class="val">${fmtDA(gTotal)} DA</div></div></div>
                </div>
                <div class="card">
                    <div class="table-responsive" style="max-height:60vh; overflow:auto;"><table><thead>${header}</thead><tbody>${rowsHtml}${totPaid}${totDue}${totAll}${payRow}</tbody></table></div>
                    <p style="font-size:0.8rem; color:var(--muted); margin:12px 0 0;">Astuce : cliquez sur une case pour la modifier (présent, payé, absent). Les vendredis sont en rouge, les semaines alternent de couleur pour faciliter la lecture.</p>
                </div>`;
        }

        function renderPaiePiece() {
            const pieceEmps = employees.filter(e => e.type === 'piece');
            if (pieceEmps.length === 0) return `<div class="card" style="text-align:center; color:var(--muted);">Aucune couturière à la pièce. Ajoutez un employé de type "À la pièce".</div>`;
            if (!pieceEmpId || !empById(pieceEmpId) || empById(pieceEmpId).type !== 'piece') pieceEmpId = pieceEmps[0].id;
            const e = empById(pieceEmpId); const st = pieceStats(pieceEmpId);
            const plogs = salaryEntries.filter(s => s.empId === pieceEmpId && s.piece).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
            const logRows = plogs.map(s => s.kind === 'prod' ? `<tr><td>${isoToFr(s.date)}</td><td style="color:var(--brand); font-weight:600;">+${s.pieces} pièces</td><td style="text-align:right;"><i class="fas fa-trash icon-btn i-del" style="cursor:pointer;" onclick="delPiece('${s.id}')"></i></td></tr>` : `<tr><td>${isoToFr(s.date)}</td><td style="color:var(--success); font-weight:600;">Payé : ${s.journees} journée(s) · ${fmtDA(s.amount)} DA</td><td style="text-align:right;"><i class="fas fa-trash icon-btn i-del" style="cursor:pointer;" onclick="delPiece('${s.id}')"></i></td></tr>`).join('') || `<tr><td colspan="3" style="text-align:center; color:var(--muted);">Aucune entrée.</td></tr>`;
            return `<div class="card"><label>Couturière</label><select onchange="pieceEmpId=this.value; render();" style="margin-bottom:0;">${pieceEmps.map(p => `<option value="${p.id}" ${p.id === pieceEmpId ? 'selected' : ''}>${p.name}</option>`).join('')}</select></div>
                <div class="dash-grid" style="grid-template-columns:repeat(auto-fit, minmax(150px,1fr));">
                    <div class="kpi-card" style="cursor:default;"><div class="kpi-icon"><i class="fas fa-bullseye"></i></div><div class="kpi-content"><h4>Objectif</h4><div class="val">${st.target} p. = 1j</div></div></div>
                    <div class="kpi-card" style="cursor:default;"><div class="kpi-icon" style="color:var(--brand);"><i class="fas fa-layer-group"></i></div><div class="kpi-content"><h4>Pièces en attente</h4><div class="val">${st.pending}</div></div></div>
                    <div class="kpi-card" style="cursor:default;"><div class="kpi-icon" style="color:var(--warning); background:rgba(245,158,11,0.1);"><i class="fas fa-calendar-day"></i></div><div class="kpi-content"><h4>Journées à payer</h4><div class="val">${st.jAvail}</div></div></div>
                    <div class="kpi-card" style="cursor:default;"><div class="kpi-icon" style="color:var(--success); background:rgba(16,185,129,0.1);"><i class="fas fa-money-bill"></i></div><div class="kpi-content"><h4>Montant dû</h4><div class="val">${fmtDA(st.jAvail * st.rate)} DA</div></div></div>
                </div>
                <div class="grid-2">
                    <div class="card" style="margin-bottom:0;"><h3><i class="fas fa-plus-circle" style="color:var(--brand); margin-right:8px;"></i>Ajouter une production</h3>
                        <label>Date</label><input type="date" id="pc_date" value="${isoNow()}" style="margin-bottom:15px;">
                        <label>Nombre de pièces réalisées</label><input type="number" id="pc_qty" placeholder="Ex : 150" style="margin-bottom:15px;">
                        <button class="btn-action" onclick="addPiece('${pieceEmpId}')"><i class="fas fa-check"></i> Enregistrer la production</button>
                    </div>
                    <div class="card" style="margin-bottom:0;"><h3><i class="fas fa-hand-holding-dollar" style="color:var(--success); margin-right:8px;"></i>Payer les journées</h3>
                        <p style="color:var(--muted); font-size:0.9rem;">${e.name} a produit <b style="color:var(--text);">${st.pending}</b> pièces non payées, soit <b style="color:var(--text);">${st.jAvail} journée(s)</b> à ${fmtDA(st.rate)} DA. Reste : ${st.remainder} pièces vers la prochaine journée.</p>
                        <button class="btn-action" style="background:var(--success);" ${st.jAvail <= 0 ? 'disabled' : ''} onclick="payPiece('${pieceEmpId}')"><i class="fas fa-money-bill-wave"></i> Payer ${st.jAvail} journée(s) = ${fmtDA(st.jAvail * st.rate)} DA</button>
                    </div>
                </div>
                <div class="card"><h3><i class="fas fa-clock-rotate-left" style="color:var(--brand); margin-right:8px;"></i>Historique — ${e.name}</h3><div class="table-responsive" style="max-height:300px;"><table><thead><tr><th>Date</th><th>Mouvement</th><th></th></tr></thead><tbody>${logRows}</tbody></table></div></div>`;
        }

        function renderPaieEmployes(q) {
            const list = employees.filter(e => !q || normalize(e.name).includes(q));
            if (employees.length === 0) return `<div class="card" style="text-align:center; color:var(--muted);">Aucun employé. Cliquez sur "Ajouter un employé".</div>`;
            const rows = list.map(e => `<tr style="${e.active ? '' : 'opacity:0.5;'}">
                    <td style="cursor:pointer;" onclick="openEmpDetail('${e.id}')"><b style="color:var(--brand);">${e.name}</b> <i class="fas fa-clock-rotate-left" style="font-size:0.8rem; color:var(--muted); margin-left:6px;"></i></td>
                    <td>${e.type === 'piece' ? '<span class="badge-status s-purple">À la pièce</span>' : '<span class="badge-status s-muted">Au jour</span>'}</td>
                    <td>${fmtDA(e.dailyRate)} DA${e.type === 'piece' ? ` / ${e.pieceTarget}p` : '/j'}</td>
                    <td style="text-align:right; white-space:nowrap;">
                        <i class="fas fa-print icon-btn i-edit" title="Fiche de paie" style="cursor:pointer; margin-right:8px;" onclick="printPayslip('${e.id}', paieMonth)"></i>
                        <i class="fas ${e.active ? 'fa-toggle-on' : 'fa-toggle-off'}" title="Activer/Désactiver" style="color:${e.active ? 'var(--success)' : 'var(--muted)'}; cursor:pointer; margin-right:12px; font-size:1.1rem;" onclick="toggleEmpActive('${e.id}')"></i>
                        <i class="fas fa-edit icon-btn i-edit" style="cursor:pointer; margin-right:8px;" onclick="openEmpModal('${e.id}')"></i>
                        <i class="fas fa-trash icon-btn i-del" style="cursor:pointer;" onclick="delEmployee('${e.id}')"></i>
                    </td></tr>`).join('');
            return `<div class="card"><h3><i class="fas fa-users" style="color:var(--brand); margin-right:8px;"></i>Liste des employés</h3>
                <p style="font-size:0.8rem; color:var(--muted); margin:-10px 0 15px;">Touchez le nom d'un employé pour voir tout son historique.</p>
                <div class="table-responsive"><table><thead><tr><th>Nom</th><th>Type</th><th>Tarif</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
            </div>`;
        }

        function openEmpDetail(id) { paieEmpDetail = id; paieView = 'employes'; render(); }
        function closeEmpDetail() { paieEmpDetail = null; render(); }

        function renderPaieEmployeDetail(empId) {
            const e = empById(empId); if (!e) { paieEmpDetail = null; return renderPaieEmployes(''); }
            const mine = salaryEntries.filter(s => s.empId === empId);
            const backBtn = `<button class="btn-action btn-ghost" style="width:auto; padding:10px 16px;" onclick="closeEmpDetail()"><i class="fas fa-arrow-left"></i> Retour</button>`;
            const headerBar = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px;">
                    ${backBtn}

                const hist = mine.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(s => s.kind === 'prod' ? `<tr><td style="white-space:nowrap;">${isoToFr(s.date)}</td><td style="color:var(--brand); font-weight:600;">+${s.pieces} pièces produites</td><td style="text-align:right;"><i class="fas fa-trash icon-btn i-del" style="cursor:pointer;" onclick="delPiece('${s.id}')"></i></td></tr>` : `<tr><td style="white-space:nowrap;">${isoToFr(s.date)}</td><td style="color:var(--success); font-weight:600;">Payé : ${s.journees} journée(s) · ${fmtDA(s.amount)} DA</td><td style="text-align:right;"><i class="fas fa-trash icon-btn i-del" style="cursor:pointer;" onclick="delPiece('${s.id}')"></i></td></tr>`).join('') || `<tr><td colspan="3" style="text-align:center; color:var(--muted);">Aucun mouvement.</td></tr>`;

            const daysWorked = mine.filter(s => s.status === 'paid' || s.status === 'present').length; const absDays = mine.filter(s => s.status === 'absent').length;
            const kpis = `<div class="dash-grid" style="grid-template-columns:repeat(auto-fit, minmax(150px,1fr));">

                <div class="kpi-card" style="cursor:default;"><div class="kpi-icon" style="color:var(--danger); background:rgba(239,68,68,0.1);"><i class="fas fa-user-xmark"></i></div><div class="kpi-content"><h4>Absences</h4><div class="val">${absDays}</div></div></div>
            </div>`;
            const byMonth = {}; mine.forEach(s => { const ym = (s.date || '').slice(0, 7); if (!ym) return; if (!byMonth[ym]) byMonth[ym] = { paid: 0, due: 0 }; if (s.status === 'paid') byMonth[ym].paid += (s.amount || 0); else if (s.status === 'present') byMonth[ym].due += (s.amount || 0); });

            openModal('custom', u ? "Modifier l'utilisateur" : "Nouvel utilisateur", html, (val) => {
                if (!val) return;

                const pin = document.getElementById('u_pin').value.trim();
                const role = document.getElementById('u_role').value;
                if (!name) return showToast('Nom requis.', 'warning');
                if (!/^\d{4}$/.test(pin)) return showToast('Le PIN doit comporter exactement 4 chiffres.', 'warning');
                const dup = users.find(x => x.pin === pin && (!u || x.id !== u.id));
                if (dup) return showToast(`Ce PIN est déjà utilisé par ${dup.name}.`, 'error');

                const applyChange = () => {
                    if (u) { u.name = name; u.pin = pin; u.role = role; logAudit(`Utilisateur modifié: ${name} (${role === 'admin' ? 'Admin' : 'Opérateur'})`); }
                    else { users.push({ id: uid('usr'), name, pin, role, active: true }); logAudit(`Utilisateur créé: ${name} (${role === 'admin' ? 'Admin' : 'Opérateur'})`); }

                };

                const pinChanged = !u || u.pin !== pin;
                const touchesAdmin = role === 'admin' || (u && u.role === 'admin');
                if (pinChanged && touchesAdmin) {
                    verificationCode2FA = Math.floor(100000 + Math.random() * 900000).toString();
                    sendTelegramAlert(`🔐 SÉCURITÉ : Confirmation requise pour ${u ? 'modifier' : 'créer'} le compte administrateur "${name}".\nCode de vérification : ${verificationCode2FA}`);
                    setTimeout(() => {
                        openModal('prompt', 'Double Authentification', 'Entrez le code de vérification envoyé sur Telegram :', (code) => {
                            if (code === verificationCode2FA) applyChange();

                        }, 'fa-user-shield', 'var(--brand)');
                    }, 350);
                } else {
                    applyChange();
                }
            }, 'fa-id-badge', 'var(--brand)');

        // --- SAUVEGARDE / RESTAURATION ---
        function downloadBackup() {
            const payload = { exportedAt: new Date().toISOString(), rolls, rollCategories, families, lots, shipLogs, expenses, audit, team, clients, users, rates, config, employees, salaryEntries };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `klaro_sauvegarde_${isoNow()}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            config.lastBackup = Date.now(); save(); logAudit('Sauvegarde téléchargée'); showToast('Sauvegarde téléchargée avec succès.', 'success'); render();
        }
        function restoreBackupFile(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    openModal('confirm', 'Restaurer la sauvegarde', `Remplacer TOUTES les données actuelles par cette sauvegarde du <b>${data.exportedAt ? new Date(data.exportedAt).toLocaleString('fr-FR') : 'fichier importé'}</b> ?<br><br><span style="color:var(--danger);">Cette action est irréversible.</span>`, (v) => {
                        if (v) {
                            rolls = data.rolls || []; rollCategories = data.rollCategories || rollCategories; families = data.families || []; lots = data.lots || [];
                            shipLogs = data.shipLogs || []; expenses = data.expenses || []; audit = data.audit || []; team = data.team || []; clients = data.clients || [];
                            rates = data.rates || rates; config = data.config || config; employees = data.employees || []; salaryEntries = data.salaryEntries || [];
                            users = data.users && data.users.length ? data.users : [{ id: uid('usr'), name: 'Administrateur', pin: (data.config && data.config.pin) || '0000', role: 'admin', active: true }];
                            lots.forEach(l => {
                                if (Array.isArray(l.families) && l.families.length) {
                                    const f0 = l.families[0];
                                    l.familyId = f0.familyId; l.familyName = f0.familyName;
                                    l.pieces = l.families.reduce((a, x) => a + (parseInt(x.pieces) || 0), 0);
                                    l.piecesEstimated = l.families.reduce((a, x) => a + (parseInt(x.piecesEstimated != null ? x.piecesEstimated : x.pieces) || 0), 0);
                                    l.scrapKg = l.families.reduce((a, x) => a + (parseFloat(x.scrapKg) || 0), 0);
                                    l.scrapPct = l.weightConsumed > 0 ? (l.scrapKg / l.weightConsumed * 100) : 0;
                                }
                                delete l.families;
                                if (!l.name) l.name = '';
                            });
                            paieMigrate(); logAudit('Sauvegarde restaurée depuis un fichier', true); save(true); showToast('Sauvegarde restaurée.', 'success');
                            currentUser = null; sessionAdmin = false; resetPin();
                            document.getElementById('login-screen').style.display = 'flex'; document.getElementById('login-screen').style.opacity = '1';
                        }
                    }, 'fa-triangle-exclamation', 'var(--warning)');
                } catch (err) { showToast('Fichier invalide.', 'error'); }
            };
            reader.readAsText(file); event.target.value = '';
        }
        function checkBackupReminder() {
            if (!config.lastBackup || (Date.now() - config.lastBackup) > 7 * 86400000) {
                setTimeout(() => showToast("Pensez à télécharger une sauvegarde cette semaine (Réglages).", "warning"), 1200);
            }
        }

        // --- BILAN : IMPRESSION + WHATSAPP ---

        function bilanTotals() {
            const filteredShips = shipLogs.filter(sl => checkInPeriod(sl.ts, bilanPeriod));
            const filteredExpenses = expenses.filter(ex => checkInPeriod(ex.ts, bilanPeriod));
            const totalRev = filteredShips.reduce((a, b) => a + (parseFloat(b.total) || 0), 0);
            const totalEx = filteredExpenses.reduce((a, b) => a + (parseFloat(b.amountDA) || 0), 0);
            return { totalRev, totalEx, profit: totalRev - totalEx, nbShips: filteredShips.length, nbEx: filteredExpenses.length };
        }
        function printBilan() {
            const { totalRev, totalEx, profit, nbShips, nbEx } = bilanTotals();
            const periodStr = bilanPeriod === 'all' ? 'Globale' : (bilanPeriod === 'today' ? "Aujourd'hui" : 'Ce mois-ci');
            const pb = document.getElementById('printBox');
            pb.innerHTML = `
