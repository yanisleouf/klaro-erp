    <style>
        :root {
            --bg: #0b1120; --panel: #1e293b; --panel2: #16213a; --brand: #3b82f6; --brand-hover: #2563eb;
            --neon: #60a5fa; --text: #f8fafc; --muted: #94a3b8;
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --purple: #8b5cf6;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            --week-a: rgba(59, 130, 246, 0.05); --week-b: rgba(255, 255, 255, 0.02);
        }

        .theme-pink { --bg: #14050e; --panel: #260f1d; --panel2: #1c0a16; --brand: #e11d48; --brand-hover: #be123c; --neon: #fb7185; --text: #ffe4e6; --border: rgba(255, 255, 255, 0.08); --week-a: rgba(225, 29, 72, 0.06); --week-b: rgba(255, 255, 255, 0.02); }
        .theme-light { --bg: #f1f5f9; --panel: #ffffff; --panel2: #f8fafc; --brand: #2563eb; --brand-hover: #1d4ed8; --neon: #334155; --text: #0f172a; --muted: #64748b; --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --week-a: rgba(37, 99, 235, 0.05); --week-b: rgba(0,0,0,0.015); }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; transition: background-color 0.3s ease, color 0.3s ease; }

        /* --- LOGIN SCREEN --- */
        #login-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: var(--panel); padding: 40px; border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-hover); text-align: center; max-width: 350px; width: 100%; }
        .pin-dots { display: flex; justify-content: center; gap: 15px; margin: 30px 0; }
        .pin-dot { width: 15px; height: 15px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid var(--border); transition: 0.2s; }
        .pin-dot.active { background: var(--brand); box-shadow: 0 0 10px var(--brand); }

        /* --- SPLASH SCREEN --- */
        #splash-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease, visibility 0.6s; }
        .splash-logo { animation: pulseGlow 2s infinite alternate; }
        .splash-logo img { width: min(72vw, 340px); height: auto; display: block; }
        .splash-text { margin-top: 15px; color: var(--muted); font-size: 1rem; letter-spacing: 3px; text-transform: uppercase; animation: fadeInUp 1s ease forwards; opacity: 0; font-weight: 600; }
        .loader-container { width: 250px; height: 4px; background: rgba(255,255,255,0.05); border-radius: 4px; margin-top: 40px; overflow: hidden; position: relative; }
        .theme-light .loader-container { background: rgba(0,0,0,0.05); }
        .loader-bar { width: 0%; height: 100%; background: var(--brand); box-shadow: 0 0 15px var(--brand); animation: loadProgress 2s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes pulseGlow { 0% { filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0)); transform: scale(1); } 100% { filter: drop-shadow(0 0 26px rgba(59, 130, 246, 0.55)); transform: scale(1.03); } }
        @keyframes loadProgress { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .fade-in-view { animation: fadeInTab 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeInTab { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* --- NAVIGATION --- */
        nav { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 20px 0; z-index: 100; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        nav.floating { width: 75px; }
        nav.floating:hover { width: 250px; box-shadow: 5px 0 15px rgba(0,0,0,0.2); overflow-y: auto;}
        nav.fixed { width: 250px; box-shadow: 5px 0 15px rgba(0,0,0,0.2); overflow-y: auto;}

        .nav-brand { margin-bottom: 20px; display: flex; align-items: center; justify-content: center; width: 100%; transition: all 0.3s ease; padding: 0 8px; box-sizing: border-box;}
        .nav-brand img { width: 44px; max-width: 100%; height: auto; max-height: 44px; object-fit: contain; display: block; transition: width 0.3s ease, max-height 0.3s ease; }
        nav.fixed .nav-brand img, nav.floating:hover .nav-brand img { width: 175px; max-height: 72px; }
        .nav-item { display: flex; align-items: center; width: 85%; padding: 12px; color: var(--muted); border-radius: 10px; margin-bottom: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; transition: all 0.2s ease; }
        .nav-item i { min-width: 35px; font-size: 1.2rem; text-align: center; }
        .nav-item span { opacity: 0; margin-left: 15px; font-weight: 600; font-size: 0.95rem; transition: opacity 0.3s ease, transform 0.3s ease; transform: translateX(-10px);}
        nav.fixed .nav-item span, nav.floating:hover .nav-item span { opacity: 1; transform: translateX(0);}
        .nav-item:hover { background: rgba(59, 130, 246, 0.1); color: var(--brand); }
        .theme-pink .nav-item:hover { background: rgba(225, 29, 72, 0.1); }
        .theme-light .nav-item:hover { background: #e2e8f0; color: var(--brand); }
        .nav-item.active { background: var(--brand); color: #fff; box-shadow: var(--shadow); }
        .nav-sep { width: 70%; height: 1px; background: var(--border); margin: 8px 0 12px; flex-shrink: 0; }

        /* --- LAYOUT PRINCIPAL --- */
        main { flex-grow: 1; display: flex; flex-direction: column; padding: 20px 30px; height: 100vh; overflow: hidden; min-width: 0; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; background: var(--panel); padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); flex-shrink: 0; gap: 10px; flex-wrap: wrap; }
        #view { flex-grow: 1; overflow-y: auto; padding-right: 10px; padding-bottom: 20px; -webkit-overflow-scrolling: touch; }

        /* --- TOP BAR ACTIONS --- */
        .top-actions { display: flex; align-items: center; justify-content: flex-end; gap: 15px; flex-grow: 1; }
        .action-wrapper { position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border); transition: all 0.2s; flex-shrink:0; }
        .theme-light .action-wrapper { background: #e2e8f0; }
        .action-wrapper:hover { background: rgba(255,255,255,0.05); }
        .action-wrapper i { color: var(--muted); font-size: 1.2rem; transition: color 0.2s;}
        .action-wrapper:hover i { color: var(--brand); }
        .user-badge { width: auto; padding: 0 16px; border-radius: 20px; gap: 8px; }
        .user-badge span { color: var(--text); max-width: 140px; overflow: hidden; text-overflow: ellipsis; }

        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.75rem; font-weight: bold; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(239, 68, 68, 0.5); animation: popBadge 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        // Paie

        function isoNow(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

        let paieView = 'pointage', paieMonth = ymNow(), pieceEmpId = null, paieDate = isoNow(), paieEmpDetail = null;

        // Pipeline de production : etapes ordonnees
        const STAGES = ['pesee', 'matelassage', 'couture', 'emballage', 'termine'];
        const STAGE_LABELS = { pesee: 'Pesée', matelassage: 'Matelassage', couture: 'Couture', emballage: 'Emballage', termine: 'Terminé' };

        // ==========================================
        // --- HELPERS GENERIQUES ---
        // ==========================================
        function normalize(s) { return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
        function fmtDA(n) { return (Math.round(n) || 0).toLocaleString('fr-FR'); }
        function uid(pfx) { return pfx + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
        function nowFR() { return new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
        function isoToFr(iso) { if (!iso) return ''; const p = iso.split('-'); return `${p[2]}/${p[1]}/${p[0]}`; }
        function daysInMonth(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
        function monthLabel(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); }
        function weekBandOfDay(iso) {
            const [y, m, d] = iso.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            const firstOfMonth = new Date(y, m - 1, 1);
            const offset = firstOfMonth.getDay(); // 0=dim
            const weekIdx = Math.floor((d - 1 + offset) / 7);
            return weekIdx % 2;
        }

        function checkInPeriod(ts, period) {
            if (!ts) return period === 'all';
            if (period === 'all') return true;
            const d = new Date(ts), today = new Date();
            if (period === 'today') return d.toDateString() === today.toDateString();
            if (period === 'month') return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
            return true;
        }
        function checkInRange(ts, fromStr, toStr) {
            if (!ts) return false;
            if (fromStr) { const f = new Date(fromStr); f.setHours(0, 0, 0, 0); if (ts < f.getTime()) return false; }
            if (toStr) { const t = new Date(toStr); t.setHours(23, 59, 59, 999); if (ts > t.getTime()) return false; }
            return true;
        }

        // ==========================================
        // --- CALCUL DE STOCK REEL (Familles) ---
        // ==========================================
        function getFamilyStock(familyId) {
            const produit = lots.filter(l => l.stage === 'termine' && l.familyId === familyId).reduce((acc, l) => acc + (parseInt(l.pieces) || 0), 0);
            const vendu = shipLogs.reduce((acc, sl) => {
                const q = sl.items ? sl.items.filter(i => i.familyId === familyId).reduce((a, b) => a + (parseInt(b.qty) || 0), 0) : 0;
                return acc + q;
            }, 0);
            return produit - vendu;
        }
        function familyById(id) { return families.find(f => f.id === id); }
        function variantById(fam, vid) { return fam ? (fam.variants || []).find(v => v.id === vid) : null; }
        function rollById(id) { return rolls.find(r => r.id === id); }
        function lotById(id) { return lots.find(l => l.id === id); }
        function clientById(name) { return clients.find(c => c.name === name); }

        // ==========================================
        // --- CHARGEMENT DEPUIS LE CLOUD ---
        // ==========================================
        async function loadCloudData() {
            try {
                const docSnap = await dbRef.get();
                if (docSnap.exists) {
                    const data = docSnap.data();
                    rolls = data.rolls || data.stock || [];
                    rollCategories = data.rollCategories || ["Coton", "Polyester", "Microfibre"];
                    families = data.families || [];
                    lots = data.lots || [];
                    shipLogs = data.shipLogs || [];
                    expenses = data.expenses || [];
                    audit = data.audit || [];
                    team = data.team || ["Opérateur 1"];
                    clients = data.clients || [{ name: "Client Comptoir", address: "", rc: "", nif: "", nis: "", art: "", phone: "" }];
                    rates = data.rates || { eur: 240, usd: 220 };
                    config = data.config || config;
                    users = data.users || [];
                    employees = data.employees || []; salaryEntries = data.salaryEntries || [];

                    // --- MIGRATION : ancien systeme "modeles + logs" vers familles + lots ---
                    if ((!families.length) && Array.isArray(data.models) && data.models.length) {
                        data.models.forEach(m => {
                            const fam = { id: uid('fam'), name: m.name, unitWeight: m.weight || 0.05, variants: [{ id: uid('var'), name: m.name, priceDirect: m.price || 0, priceWholesale: m.price || 0, pricePartner: m.price || 0 }] };
                            families.push(fam);
                            (data.logs || []).filter(l => l.mod === m.name).forEach(l => {
                                lots.push({ id: uid('lot'), ref: 'LOT-' + (l.id || Date.now()), rollRef: '', familyId: fam.id, familyName: fam.name, weightConsumed: (l.pcs || 0) * (m.weight || 0.05) + (parseFloat(l.scrap) || 0), pieces: l.pcs || 0, scrapKg: parseFloat(l.scrap) || 0, scrapPct: parseFloat(l.scrapPct) || 0, stage: 'termine', operator: l.emp || '', createdAt: Date.now(), history: [{ stage: 'termine', date: l.date || nowFR(), operator: l.emp || '' }] });
                            });
                        });
                    }
                    if (!rolls.length && Array.isArray(data.stock)) rolls = data.stock;
                    rolls.forEach(r => { if (!r.category) r.category = rollCategories[0] || 'Autre'; if (!r.color) r.color = ''; });
                    if (Array.isArray(data.shipLogs)) {
                        shipLogs.forEach(sl => {
                            if (!sl.ts) sl.ts = Date.parse(sl.date && sl.date.split(' ')[0].split('/').reverse().join('-')) || Date.now();
                            if (sl.items) sl.items.forEach(it => {
                                if (!it.familyId && it.mod) { const f = families.find(x => x.name === it.mod || (x.variants || []).some(v => v.name === it.mod)); if (f) { it.familyId = f.id; it.familyName = f.name; it.qty = it.pcs || it.qty; } }
                            });
                        });
                    }
                    expenses.forEach(ex => { if (!ex.ts) ex.ts = Date.parse((ex.date || '').split(' ')[0].split('/').reverse().join('-')) || Date.now(); });
                    lots.forEach(l => { if (!l.ts) l.ts = l.createdAt || Date.now(); });
                    // --- MIGRATION : ancien lot multi-familles (tableau families[]) -> champs simples ---
                    lots.forEach(l => {
                        if (Array.isArray(l.families) && l.families.length) {
                            const f0 = l.families[0];
                            l.familyId = f0.familyId; l.familyName = f0.familyName;
                            l.pieces = l.families.reduce((a, x) => a + (parseInt(x.pieces) || 0), 0);
                            l.piecesEstimated = l.families.reduce((a, x) => a + (parseInt(x.piecesEstimated != null ? x.piecesEstimated : x.pieces) || 0), 0);
                            l.scrapKg = l.families.reduce((a, x) => a + (parseFloat(x.scrapKg) || 0), 0);
                            l.scrapPct = l.weightConsumed > 0 ? (l.scrapKg / l.weightConsumed * 100) : 0;
                        }
                        delete l.families;
                        if (!l.name) l.name = '';
                    });
                } else {
                    team = ["Opérateur 1"];
                    clients = [{ name: "Client Comptoir", address: "", rc: "", nif: "", nis: "", art: "", phone: "" }];
                    save();
                }
                localRev = docSnap.exists ? ((docSnap.data() || {})._rev || 0) : 0;

                if (!config.company) config.company = { name: "KLARO INC", address: "Alger", rc: "", nif: "", nis: "", art: "", phone: "" };
                if (typeof config.company.phone === 'undefined') config.company.phone = "";
                if (typeof config.sound === 'undefined') config.sound = true;
                if (typeof config.navFixed === 'undefined') config.navFixed = false;
                if (!config.kpi) config.kpi = { rolls: true, ship: true, rev: true, debt: true, loss: true };
                if (!config.invoice) config.invoice = { prefix: "FACT", next: 1 };
                // --- MIGRATION : ancien PIN unique -> compte Administrateur nomme ---
                if (!Array.isArray(users) || users.length === 0) {
                    users = [{ id: uid('usr'), name: 'Administrateur', pin: config.pin || '0000', role: 'admin', active: true }];
                }
                paieMigrate();

                shipLogs.forEach(sl => {
                    if (!sl.id) sl.id = uid('sl');
                    if (!sl.status) sl.status = 'paid';
                    if (!sl.delivery) sl.delivery = 'pending';
                    if (!sl.total && sl.items) sl.total = sl.items.reduce((a, b) => a + b.total, 0);
                });

                startRealtimeSync();

                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.getElementById('login-screen').style.display = 'flex';
                }, 600);

            } catch (error) {
                console.error("Erreur de connexion Cloud :", error);
                showToast("Erreur de connexion à la base de données (mode hors-ligne)", "error");
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => { splash.style.display = 'none'; document.getElementById('login-screen').style.display = 'flex'; }, 600);
            }
        }
        window.addEventListener('load', loadCloudData);

        // --- GESTION DU LOGIN (PIN) ---
        function addPinDigit(digit) {
            if (enteredPin.length < 4) {
                enteredPin += digit;
                updatePinDots();
                if (enteredPin.length === 4) { setTimeout(checkLogin, 200); }
            }
        }
        function updatePinDots() { const dots = document.querySelectorAll('.pin-dot'); dots.forEach((dot, i) => dot.classList.toggle('active', i < enteredPin.length)); }
        function resetPin() { enteredPin = ""; updatePinDots(); }
        function checkLogin() {
            const match = users.find(u => u.pin === enteredPin && u.active !== false);
            if (match) {
                currentUser = { id: match.id, name: match.name, role: match.role };
                sessionAdmin = match.role === 'admin';
                sendTelegramAlert(`✅ CONNEXION RÉUSSIE : ${match.name} (${match.role === 'admin' ? 'Admin' : 'Opérateur'})`);

        }
        function initApp() {
            document.body.className = 'theme-' + config.theme;
            updateNav();
            updateUserBadge();
            checkAlerts();
            checkBackupReminder();
            tab('Dashboard', document.querySelector('.nav-item'));

        }
        function updateUserBadge() {
            const box = document.getElementById('userBtn'); if (!box || !currentUser) return;
            box.innerHTML = `<i class="fas ${currentUser.role === 'admin' ? 'fa-user-shield' : 'fa-user'}"></i><span style="font-size:0.85rem; font-weight:700; white-space:nowrap;">${currentUser.name}</span>`;
            box.title = `Connecté(e) en tant que ${currentUser.name} — cliquer pour se déconnecter`;
        }

        // --- SYNCHRONISATION TEMPS REEL (multi-appareils) ---
        function applyRemoteData(data) {
            rolls = data.rolls || []; rollCategories = data.rollCategories || rollCategories; families = data.families || [];
            lots = data.lots || []; shipLogs = data.shipLogs || []; expenses = data.expenses || []; audit = data.audit || [];
            team = data.team || team; clients = data.clients || clients; users = data.users || users;
            rates = data.rates || rates; config = data.config || config; employees = data.employees || []; salaryEntries = data.salaryEntries || [];
            lots.forEach(l => {
                if (Array.isArray(l.families) && l.families.length) {
                    const f0 = l.families[0];
                    l.familyId = f0.familyId; l.familyName = f0.familyName;
                    l.pieces = l.families.reduce((a, x) => a + (parseInt(x.pieces) || 0), 0);
                    l.piecesEstimated = l.families.reduce((a, x) => a + (parseInt(x.piecesEstimated != null ? x.piecesEstimated : x.pieces) || 0), 0);
                    l.scrapKg = l.families.reduce((a, x) => a + (parseFloat(x.scrapKg) || 0), 0);
                    l.scrapPct = l.weightConsumed > 0 ? (l.scrapKg / l.weightConsumed * 100) : 0;
                }
                delete l.families;
                if (!l.name) l.name = '';
            });
            paieMigrate();
        }
        function startRealtimeSync() {
            if (!dbRef || dbUnsubscribe || typeof dbRef.onSnapshot !== 'function') return;
            try {
                dbUnsubscribe = dbRef.onSnapshot((snap) => {
                    if (!snap.exists || (snap.metadata && snap.metadata.hasPendingWrites)) return; // pas encore confirme par le serveur (notre propre ecriture) : on ignore
                    const data = snap.data();
                    const remoteRev = data._rev || 0;
                    if (remoteRev === localRev) return; // rien de nouveau depuis un autre appareil
                    applyRemoteData(data);
                    localRev = remoteRev;
                    if (currentUser) { render(); showToast("Données mises à jour (modifiées sur un autre appareil).", "warning"); }
                }, (err) => { console.error("Erreur de synchronisation temps réel :", err); });
            } catch (e) {
                console.error("Impossible de démarrer la synchronisation temps réel :", e);
            }
        }

        // --- SAUVEGARDE CLOUD (transaction protegee contre les ecrasements concurrents) ---
        // force=true : ecrase quand meme (utilise uniquement pour "Restaurer une sauvegarde", ou l'utilisateur a deja confirme le remplacement total)
        // Les sauvegardes sont mises en file (saveQueue) pour qu'un 2e appel rapide de save() ne se compare pas
        // a un 1er appel encore en vol et ne declenche pas un faux conflit avec... lui-meme.
        let saveQueue = Promise.resolve();
        function save(force = false) {
            if (!dbRef || !db) { showToast("Hors-ligne : modification non synchronisée", "warning"); checkAlerts(); return; }
            const payload = { rolls, rollCategories, families, lots, shipLogs, expenses, audit, team, clients, users, rates, config, employees, salaryEntries };
            const runOne = () => db.runTransaction(async (tx) => {
                const snap = await tx.get(dbRef);
                const remoteRev = snap.exists ? (snap.data()._rev || 0) : 0;
                if (!force && remoteRev !== localRev) { const err = new Error('stale'); err.stale = true; err.remoteData = snap.data(); throw err; }
                const nextRev = remoteRev + 1;
                tx.set(dbRef, { ...payload, _rev: nextRev });
                return nextRev;
            }).then((nextRev) => {
                localRev = nextRev; checkAlerts();
            }).catch((error) => {
                if (error && error.stale) {
                    applyRemoteData(error.remoteData);
                    localRev = error.remoteData._rev || 0;
                    render();
                    showToast("Des données ont été modifiées ailleurs entre-temps : votre dernière action n'a pas été enregistrée, réessayez.", "error");
                } else {
                    console.error("Erreur de sauvegarde: ", error);
                    showToast("Erreur de synchronisation", "error");
                }
            });
            saveQueue = saveQueue.then(runOne);
        }
        function logAudit(action, doNotSaveYet = false) {
            const userLabel = currentUser ? `${currentUser.name} (${currentUser.role === 'admin' ? 'Admin' : 'Opérateur'})` : (sessionAdmin ? 'Admin' : 'Opérateur');
            audit.unshift({ id: Date.now(), date: new Date().toLocaleString('fr-FR'), user: userLabel, action: action });
            if (audit.length > 150) audit.pop();
            if (!doNotSaveYet) save();
        }

        // --- CALCULATRICE JS ---
        function calcInput(val) {
            if (val === 'C') { window.calcExpr = ""; }
            else if (val === '=') {
                try { if (/^[0-9+\-*/.() ]+$/.test(window.calcExpr)) { window.calcExpr = String(new Function('return ' + window.calcExpr)()); } else { window.calcExpr = "Erreur"; } }
                catch (e) { window.calcExpr = "Erreur"; }
            }
            else if (val === 'DEL') { window.calcExpr = window.calcExpr.slice(0, -1); }
            else { if (window.calcExpr === "Erreur") window.calcExpr = ""; window.calcExpr += val; }
            const disp = document.getElementById('calcDisplay'); if (disp) disp.value = window.calcExpr;
        }
        function toggleCalcUI() {
            const c = document.getElementById('calcContainer'); if (!c) return;
            if (c.style.display === 'none') { c.style.display = 'block'; document.getElementById('calcDisplay').value = window.calcExpr; }
            else { c.style.display = 'none'; }
        }

        // --- SÉCURITÉ : SESSION UTILISATEUR ---
        function logoutUser() {
            const name = currentUser ? currentUser.name : '';
            openModal('confirm', 'Déconnexion', `Se déconnecter de la session de <b>${name}</b> ?`, (v) => {
                if (!v) return;
                logAudit(`Déconnexion : ${name}`);
                currentUser = null; sessionAdmin = false; currentTab = 'Dashboard';
                resetPin();
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('login-screen').style.opacity = '1';
            }, 'fa-right-from-bracket', 'var(--warning)');
        }

        // --- AUDIO & TOASTS ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function playSound(type = 'success') {
            if (!config.sound) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.1, now + 0.02); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'error' || type === 'warning') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.1, now + 0.02); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'notify') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.setValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.1, now + 0.05); gainNode.gain.setValueAtTime(0, now + 0.1);
                gainNode.gain.linearRampToValueAtTime(0.1, now + 0.15); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }
        function showToast(message, type = 'success') {
            playSound(type);
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div'); toast.className = `toast toast-${type}`;
            const icon = type === 'success' ? 'fa-check-circle' : (type === 'warning' ? 'fa-exclamation-circle' : 'fa-exclamation-triangle');
            toast.innerHTML = `<i class="fas ${icon} toast-icon"></i><div>${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 400); }, 3000);
        }

        // --- GESTION DES NOTIFICATIONS ---
        function checkAlerts() {
            let rawAlerts = [];
            rolls.forEach(r => {
                const limit = r.threshold || 5;
                if (r.res <= 0) rawAlerts.push({ type: 'danger', title: 'Rupture Rouleau', msg: `Le rouleau <b>${r.ref}</b> est vide.`, tab: 'Rouleaux' });
                else if (r.res <= limit) rawAlerts.push({ type: 'warning', title: 'Niveau Bas Rouleau', msg: `Le rouleau <b>${r.ref}</b> est presque vide (${r.res} kg - Seuil: ${limit}kg).`, tab: 'Rouleaux' });
            });
            families.forEach(f => {
                const s = getFamilyStock(f.id);
                if (s <= 0) rawAlerts.push({ type: 'danger', title: 'Rupture Produit', msg: `La famille <b>${f.name}</b> n'a plus aucune pièce.`, tab: 'Produits' });
                else if (s <= 10) rawAlerts.push({ type: 'warning', title: 'Stock Faible', msg: `Il ne reste que ${s} pièces de <b>${f.name}</b>.`, tab: 'Produits' });
            });
            shipLogs.forEach(sl => {
                if (sl.status === 'pending' && sl.dueDate) {
                    const due = new Date(sl.dueDate);
                    if (Date.now() > due.getTime() + 86400000) rawAlerts.push({ type: 'danger', title: 'Facture Échue', msg: `Le BL <b>${sl.bl}</b> (${sl.client}) a dépassé sa date limite (${due.toLocaleDateString('fr-FR')}).`, tab: 'Comptabilite' });
                }
            });
            const activeLots = lots.filter(l => l.stage !== 'termine').length;
            if (activeLots >= 8) rawAlerts.push({ type: 'warning', title: 'File de Production', msg: `${activeLots} lots sont en cours dans le pipeline de production.`, tab: 'Production' });

            currentAlerts = rawAlerts.filter(a => !sessionIgnoredAlerts.includes(a.title + a.msg));
            const badge = document.getElementById('notifBadge');
            document.getElementById('notifCountText').innerText = currentAlerts.length + (currentAlerts.length > 1 ? " alertes" : " alerte");
            if (currentAlerts.length > 0) { badge.style.display = 'flex'; badge.innerText = currentAlerts.length; } else { badge.style.display = 'none'; }
            if (currentAlerts.length > previousAlertCount && config.sound) playSound('notify');
            previousAlertCount = currentAlerts.length;

            const list = document.getElementById('notifList');
            if (currentAlerts.length === 0) {
                list.innerHTML = `<div style="padding:30px; text-align:center; color:var(--muted);"><i class="fas fa-check-circle" style="font-size:2rem; opacity:0.3; display:block; margin-bottom:10px;"></i>Tout est en ordre</div>`;
            } else {
                list.innerHTML = currentAlerts.map((a, index) => `
                    <div class="notif-item">
                        <div style="display:flex; flex-grow:1; gap:12px;" onclick="goToTabFromNotif('${a.tab}')">
                            <i class="fas ${a.type === 'danger' ? 'fa-exclamation-circle' : 'fa-exclamation-triangle'}" style="color:var(--${a.type}); margin-top:5px;"></i>
                            <div style="display:flex; flex-direction:column; gap:4px; flex-grow:1;"><b style="font-size:0.9rem; color:var(--text);">${a.title}</b><span style="font-size:0.8rem; color:var(--muted); line-height:1.4;">${a.msg}</span></div>
                        </div>
                        <button class="notif-close" onclick="dismissAlert(event, ${index})" title="Ignorer"><i class="fas fa-times"></i></button>
                    </div>`).join('');
            }
        }
        function dismissAlert(event, index) { event.stopPropagation(); const a = currentAlerts[index]; sessionIgnoredAlerts.push(a.title + a.msg); checkAlerts(); }
        function toggleNotifPanel() { document.getElementById('notifPanel').classList.toggle('active'); }
        function goToTabFromNotif(tabName) {
            document.getElementById('notifPanel').classList.remove('active');
            const idx = ['Dashboard', 'Rouleaux', 'Production', 'Produits', 'Ventes', 'Comptabilite', 'Paie', 'Parametres'].indexOf(tabName);
            tab(tabName, document.querySelectorAll('.nav-item')[idx] || null);
        }
        document.addEventListener('click', function (e) {
            const btn = document.getElementById('notifBtn'), panel = document.getElementById('notifPanel');
            if (btn && !btn.contains(e.target) && panel.classList.contains('active')) panel.classList.remove('active');
        });

        // --- MODALES ---
        let modalCallback = null; const modalOverlay = document.getElementById('custom-modal-overlay');
        function openModal(type, title, message, callback, iconClass = 'fa-info-circle', iconColor = 'var(--brand)') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = message;
            document.getElementById('modal-icon').className = `fas ${iconClass}`;
            document.getElementById('modal-icon').style.color = iconColor;
            const inputField = document.getElementById('modal-input'), cancelBtn = document.getElementById('modal-cancel'), confirmBtn = document.getElementById('modal-confirm');
            modalCallback = callback; inputField.value = '';
            if (type === 'alert') { inputField.style.display = 'none'; cancelBtn.style.display = 'none'; confirmBtn.innerText = 'OK'; confirmBtn.style.background = iconColor; }
            else if (type === 'confirm') { inputField.style.display = 'none'; cancelBtn.style.display = 'block'; confirmBtn.innerText = 'Confirmer'; confirmBtn.style.background = iconColor; }
            else if (type === 'prompt' || type === 'password') { inputField.style.display = 'block'; inputField.type = type === 'password' ? 'password' : 'text'; cancelBtn.style.display = 'block'; confirmBtn.innerText = 'Valider'; confirmBtn.style.background = iconColor; setTimeout(() => inputField.focus(), 100); }
            else if (type === 'custom') { inputField.style.display = 'none'; cancelBtn.style.display = 'block'; confirmBtn.innerText = 'Enregistrer'; confirmBtn.style.background = iconColor; }
            modalOverlay.classList.add('active');
        }
        function closeModal() { modalOverlay.classList.remove('active'); }
        document.getElementById('modal-cancel').addEventListener('click', () => { closeModal(); if (modalCallback) modalCallback(null); });
        document.getElementById('modal-confirm').addEventListener('click', () => { closeModal(); const val = document.getElementById('modal-input').style.display === 'block' ? document.getElementById('modal-input').value : true; if (modalCallback) modalCallback(val); });

        function updateTheme(val) { config.theme = val; save(); document.body.className = 'theme-' + val; if (currentTab === 'Dashboard') setTimeout(renderDashboardCharts, 50); if (currentTab === 'Comptabilite') setTimeout(renderComptaChart, 50); }
        function updateNavSetting(val) { config.navFixed = (val === 'fixed'); save(); updateNav(); }
        function updateSoundSetting(val) { config.sound = (val === 'true'); save(); showToast('Préférence sonore à jour', 'success'); }
        function updateNav() {
            const sidebar = document.getElementById('sidebar');
            if (config.navFixed) { sidebar.classList.add('fixed'); sidebar.classList.remove('floating'); }
            else { sidebar.classList.add('floating'); sidebar.classList.remove('fixed'); }
        }

        // ==========================================
        // --- NAVIGATION / TABS ---
        // ==========================================
        const TAB_ORDER = ['Dashboard', 'Rouleaux', 'Production', 'Produits', 'Ventes', 'Comptabilite', 'Paie', 'Parametres'];
        function tab(t, btn) {
            currentTab = t;
            paieEmpDetail = null;
            if (btn) { document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); btn.classList.add('active'); }
            else { document.querySelectorAll('.nav-item').forEach((i, idx) => i.classList.toggle('active', TAB_ORDER[idx] === t)); }
            const view = document.getElementById('view');
            view.classList.remove('fade-in-view'); void view.offsetWidth; view.classList.add('fade-in-view');
            render();
            if (t === 'Ventes') setTimeout(renderCartList, 50);
        }
        function goToRouleaux() { tab('Rouleaux', document.querySelectorAll('.nav-item')[1]); }
        function goToProduits() { tab('Produits', document.querySelectorAll('.nav-item')[3]); }
        function goToProduction() { tab('Production', document.querySelectorAll('.nav-item')[2]); }
        function goToCompta(view) { if (view) comptaView = view; comptaModel = 'tous'; tab('Comptabilite', document.querySelectorAll('.nav-item')[5]); }

        // ==========================================
        // --- MOTEUR DE RENDU UI ---
        // ==========================================
        function render() {
            const area = document.getElementById('view');
            const qRaw = document.getElementById('gSearch') ? document.getElementById('gSearch').value : "";
            const q = normalize(qRaw);
            area.innerHTML = "";

            if (currentTab === 'Dashboard') renderDashboard(area, q);
            else if (currentTab === 'Rouleaux') renderRouleaux(area, q);
            else if (currentTab === 'Production') renderProduction(area, q);
            else if (currentTab === 'Produits') renderProduits(area, q);
            else if (currentTab === 'Ventes') renderVentes(area, q);
            else if (currentTab === 'Comptabilite') renderCompta(area, q);
            else if (currentTab === 'Paie') renderPaie(area, q);
            else if (currentTab === 'Parametres') renderParametres(area, q);
        }

        // ==========================================
        // --- DASHBOARD ---
        // ==========================================
        function renderDashboard(area, q) {
            const filteredShips = shipLogs.filter(sl => checkInPeriod(sl.ts, dashPeriod));
            const filteredExpenses = expenses.filter(ex => checkInPeriod(ex.ts, dashPeriod));
            const filteredLots = lots.filter(l => checkInPeriod(l.ts, dashPeriod));

            const totalRolls = rolls.filter(r => r.res > 0).length;
            const totalShipped = filteredShips.reduce((acc, curr) => acc + (curr.items ? curr.items.reduce((a, b) => a + (parseInt(b.qty) || 0), 0) : 0), 0);
            const totalRevenue = filteredShips.reduce((acc, curr) => acc + (curr.total || 0), 0);
            const totalPending = filteredShips.filter(x => x.status === 'pending').reduce((acc, curr) => acc + (curr.total || 0), 0);
            const totalEx = filteredExpenses.reduce((acc, curr) => acc + curr.amountDA, 0);
            const profit = totalRevenue - totalEx;

            let totScrap = 0, totRaw = 0;
            filteredLots.forEach(l => { totScrap += (parseFloat(l.scrapKg) || 0); totRaw += (parseFloat(l.weightConsumed) || 0); });
            const avgScrap = totRaw > 0 ? ((totScrap / totRaw) * 100).toFixed(1) : 0;

            const activeLots = lots.filter(l => l.stage !== 'termine').length;

            let kpiCards = '';
            if (config.kpi.rolls) kpiCards += `<div class="kpi-card" onclick="goToRouleaux()" title="Voir les Rouleaux"><div class="kpi-icon"><i class="fas fa-boxes-stacked"></i></div><div class="kpi-content"><h4>Rouleaux Dispo</h4><div class="val">${totalRolls}</div></div></div>`;
            if (config.kpi.ship) kpiCards += `<div class="kpi-card" onclick="goToCompta('ventes')" title="Voir les Ventes"><div class="kpi-icon" style="color:var(--success); background:rgba(16,185,129,0.1)"><i class="fas fa-truck-ramp-box"></i></div><div class="kpi-content"><h4>Total Vendu (pcs)</h4><div class="val">${totalShipped.toLocaleString()}</div></div></div>`;
            if (config.kpi.rev) kpiCards += `<div class="kpi-card" onclick="goToCompta('ventes')" title="Voir le Registre"><div class="kpi-icon" style="color:#8b5cf6; background:rgba(139,92,246,0.1)"><i class="fas fa-piggy-bank"></i></div><div class="kpi-content"><h4>Bénéfice Net</h4><div class="val">${profit.toLocaleString()} DA</div></div></div>`;
            if (config.kpi.debt) kpiCards += `<div class="kpi-card" onclick="goToCompta('ventes')" title="Voir les Créances"><div class="kpi-icon" style="color:var(--warning); background:rgba(245,158,11,0.1)"><i class="fas fa-hand-holding-dollar"></i></div><div class="kpi-content"><h4>Créances</h4><div class="val">${totalPending.toLocaleString()} DA</div></div></div>`;
            if (config.kpi.loss) kpiCards += `<div class="kpi-card" onclick="goToProduction()" title="Voir la Production"><div class="kpi-icon" style="color:${avgScrap > 5 ? 'var(--danger)' : 'var(--muted)'}; background:rgba(255,255,255,0.05)"><i class="fas fa-recycle"></i></div><div class="kpi-content"><h4>Taux de Perte</h4><div class="val" style="color:${avgScrap > 5 ? 'var(--danger)' : 'var(--text)'}">${avgScrap} %</div></div></div>`;
            kpiCards += `<div class="kpi-card" onclick="goToProduction()" title="Voir le pipeline"><div class="kpi-icon" style="color:var(--brand);"><i class="fas fa-diagram-project"></i></div><div class="kpi-content"><h4>Lots en cours</h4><div class="val">${activeLots}</div></div></div>`;

            area.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;" class="action-header-buttons">
                    <h3 style="margin:0; font-size:1.3rem; color:var(--text);"><i class="fas fa-chart-pie" style="color:var(--brand); margin-right:8px;"></i> Vue d'ensemble</h3>
                    <select style="width:auto; margin:0; padding:8px 15px; background:var(--panel); border:1px solid var(--border);" onchange="dashPeriod=this.value; render(); setTimeout(renderDashboardCharts, 50)">
                        <option value="all" ${dashPeriod === 'all' ? 'selected' : ''}>Toute la période</option>
                        <option value="today" ${dashPeriod === 'today' ? 'selected' : ''}>Aujourd'hui</option>
                        <option value="month" ${dashPeriod === 'month' ? 'selected' : ''}>Ce mois-ci</option>
                    </select>
                </div>
                <div class="dash-grid">${kpiCards}</div>
                <div class="card" style="height: 400px; display:flex; flex-direction:column;">
                    <h3><i class="fas fa-chart-simple" style="color:var(--brand); margin-right:8px;"></i>Top Produits Vendus</h3>
                    <div style="flex-grow:1; position:relative;"><canvas id="dashChart"></canvas></div>
                </div>`;
            setTimeout(renderDashboardCharts, 50);
        }

        function renderDashboardCharts() {
            const ctx = document.getElementById('dashChart'); if (!ctx || typeof Chart === 'undefined') return;
            if (dashChart) { dashChart.destroy(); }
            const filteredShips = shipLogs.filter(sl => checkInPeriod(sl.ts, dashPeriod));
            const famInfo = {};
            filteredShips.forEach(sl => {
                if (sl.items) sl.items.forEach(it => {
                    if (it.familyId) { if (!famInfo[it.familyName]) famInfo[it.familyName] = 0; famInfo[it.familyName] += (parseInt(it.qty) || 0); }
                });
            });
            const sortedSales = Object.entries(famInfo).sort((a, b) => b[1] - a[1]).slice(0, 7);
            const labels = sortedSales.length ? sortedSales.map(x => x[0]) : ['Aucune vente'];
            const data = sortedSales.length ? sortedSales.map(x => x[1]) : [0];
            const isDark = config.theme !== 'light'; const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)'; const fontColor = isDark ? '#94a3b8' : '#64748b';
            dashChart = new Chart(ctx, {
                type: 'bar',
                data: { labels: labels, datasets: [{ label: 'Pièces vendues', data: data, backgroundColor: 'rgba(59, 130, 246, 0.8)', borderRadius: 6 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: fontColor } }, x: { grid: { display: false }, ticks: { color: fontColor } } } }
            });
        }

        // ==========================================
        // --- ROULEAUX (ex-BOBINES) ---
        // ==========================================
        function distinctRollColors() { return [...new Set(rolls.map(r => r.color).filter(Boolean))]; }
        function renderRouleaux(area, q) {
            const filtered = rolls.filter(x => !q || normalize(x.ref).includes(q) || normalize(x.category).includes(q) || normalize(x.color).includes(q));
            const catOptions = rollCategories.map(c => `<option value="${c}">${c}</option>`).join('');
            const colorList = distinctRollColors().map(c => `<option value="${c}">`).join('');
            area.innerHTML = `
                <div class="grid-1-2">
                    <div class="card">
                        <h3><i class="fas fa-plus-circle" style="color:var(--brand); margin-right:8px;"></i>Nouveau Rouleau</h3>
                        <label>Référence</label><input id="rR" placeholder="Ex: ROU-2026-A">
                        <div class="grid-2">
                            <div><label>Catégorie</label><select id="rCat">${catOptions}</select></div>
                            <div><label>Couleur</label><input id="rCol" list="colorList" placeholder="Ex: Bleu marine"><datalist id="colorList">${colorList}</datalist></div>
                        </div>
                        <div class="grid-2">
                            <div><label>Poids initial (kg)</label><input id="rW" type="number" placeholder="0.00"></div>

                        </div>
                        <button class="btn-action" onclick="addRoll()"><i class="fas fa-save"></i> Ajouter au stock</button>
                        ${sessionAdmin ? `<button class="btn-action btn-ghost" style="margin-top:10px;" onclick="manageRollCategories()"><i class="fas fa-tags"></i> Gérer les catégories</button>` : ''}
                    </div>
                    <div class="card">
                        <h3><i class="fas fa-boxes-stacked" style="color:var(--brand); margin-right:8px;"></i>Inventaire Rouleaux <span style="color:var(--muted); font-weight:400; font-size:0.85rem;">(${filtered.length})</span></h3>
                        <div class="table-responsive" style="max-height: 460px;">
                            <table>
                                <thead><tr><th>Réf.</th><th>Catégorie</th><th>Couleur</th><th style="text-align:right;">Reste</th><th style="text-align:center;">Seuil</th><th style="text-align:center;">Action</th></tr></thead>
                                <tbody>${filtered.length ? filtered.map(x => `<tr>
                                    <td><span style="background:var(--bg); padding:4px 8px; border-radius:6px; font-family:monospace; border:1px solid var(--border);">${x.ref}</span></td>
                                    <td><span class="badge-status s-purple">${x.category || '-'}</span></td>
                                    <td>${x.color ? `<span style="display:inline-flex; align-items:center; gap:6px;"><i class="fas fa-circle" style="font-size:0.6rem; color:var(--muted);"></i>${x.color}</span>` : '<span style="color:var(--muted);">-</span>'}</td>
                                    <td style="text-align:right; font-weight:800; color:${x.res <= (x.threshold || 5) ? 'var(--danger)' : 'var(--text)'}">${x.res} kg</td>
                                    <td style="text-align:center; color:var(--muted);">${x.threshold || 5} kg</td>
                                    <td style="text-align:center;">
                                        ${sessionAdmin ? `<button class="icon-btn i-edit" onclick="editRoll('${x.id}')" title="Modifier"><i class="fas fa-edit"></i></button><button class="icon-btn i-del" onclick="delRoll('${x.id}')" title="Supprimer"><i class="fas fa-trash"></i></button>` : `<i class="fas fa-lock" style="color:var(--border);" title="Sécurisé"></i>`}
                                    </td>
                                </tr>`).join('') : '<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:20px;">Aucun rouleau trouvé</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                </div>`;

        function addRoll() {
            const r = document.getElementById('rR').value.trim(), w = document.getElementById('rW').value, t = document.getElementById('rT').value;
            const cat = document.getElementById('rCat').value, col = document.getElementById('rCol').value.trim();
            if (r && w) {
                rolls.unshift({ id: uid('roll'), ref: r, category: cat, color: col, weight: parseFloat(w), res: parseFloat(w).toFixed(2), threshold: parseFloat(t) || 5, ts: Date.now() });
                logAudit(`Rouleau ajouté: ${r} (${cat}${col ? ', ' + col : ''})`); render(); showToast("Rouleau ajouté.", "success");
            } else showToast("Référence et poids requis.", "warning");
        }
        function delRoll(id) {
            const index = rolls.findIndex(x => x.id === id); if (index < 0) return;
            openModal('confirm', 'Attention', `Voulez-vous supprimer le rouleau <b>${rolls[index].ref}</b> ?`, (v) => {
                if (v) { const ref = rolls[index].ref; rolls.splice(index, 1); logAudit(`Rouleau supprimé: ${ref}`); render(); showToast("Rouleau supprimé.", "success"); }
            }, 'fa-trash', 'var(--danger)');
        }
        function editRoll(id) {
            const r = rollById(id); if (!r) return;
            const catOptions = rollCategories.map(c => `<option value="${c}" ${r.category === c ? 'selected' : ''}>${c}</option>`).join('');
            const html = `<div style="text-align:left;">
                <label>Référence</label><input id="e_rR" value="${r.ref}" style="margin-bottom:10px;">
                <div class="grid-2">
                    <div><label>Catégorie</label><select id="e_rCat" style="margin-bottom:10px;">${catOptions}</select></div>
                    <div><label>Couleur</label><input id="e_rCol" value="${r.color || ''}" style="margin-bottom:10px;"></div>
                </div>
                <div class="grid-2">
                    <div><label>Reste (kg)</label><input id="e_rRes" type="number" value="${r.res}" style="margin-bottom:10px;"></div>

            openModal('custom', 'Modifier le Rouleau', html, (val) => {
                if (val) {

        }
        function manageRollCategories() {
            const renderList = () => rollCategories.map((c, i) => `<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:var(--bg); border-radius:8px; margin-bottom:6px;"><span>${c}</span><i class="fas fa-trash icon-btn i-del" style="cursor:pointer;" onclick="delRollCategory(${i})"></i></div>`).join('') || '<p style="color:var(--muted);">Aucune catégorie.</p>';
            const html = `<div style="text-align:left;">
                <div id="catListBox">${renderList()}</div>
                <div style="display:flex; gap:8px; margin-top:12px;"><input id="newCat" placeholder="Nouvelle catégorie..." style="margin:0;"><button class="btn-action" style="width:auto;" onclick="addRollCategory()"><i class="fas fa-plus"></i></button></div>
            </div>`;
            openModal('alert', 'Catégories de Rouleaux', html, null, 'fa-tags', 'var(--brand)');

        function addRollCategory() {
            const inp = document.getElementById('newCat'); const v = inp.value.trim();
            if (v && !rollCategories.includes(v)) { rollCategories.push(v); save(); manageRollCategories(); showToast('Catégorie ajoutée', 'success'); }
